components:
  schemas:
    AcceptInvitationRequest:
      additionalProperties: false
      properties:
        password:
          type: string
        token:
          type: string
      required:
        - token
        - password
      type: object
    CreateInvitationResponseBody:
      additionalProperties: false
      properties:
        invitation_id:
          type: string
        organization_id:
          type: string
        status:
          type: string
      required:
        - status
        - invitation_id
        - organization_id
      type: object
    InvitationActionResponseBody:
      additionalProperties: false
      properties:
        email:
          type: string
        invitation_id:
          type: string
        organization_id:
          type: string
        role:
          type: string
        status:
          type: string
      required:
        - invitation_id
        - organization_id
        - email
        - role
        - status
      type: object
    InvitationRow:
      additionalProperties: false
      properties:
        created_at:
          type: string
        email:
          type: string
        expires_at:
          type: string
        invitation_id:
          type: string
        invited_by_account_id:
          type: string
        organization_id:
          type: string
        role:
          type: string
      required:
        - invitation_id
        - organization_id
        - email
        - role
        - expires_at
        - created_at
        - invited_by_account_id
      type: object
    InviteRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        role:
          type: string
      required:
        - email
        - role
      type: object
    ListInvitationsResponseBody:
      additionalProperties: false
      properties:
        invitations:
          items:
            $ref: "#/components/schemas/InvitationRow"
          type:
            - array
            - "null"
      required:
        - invitations
      type: object
    ListMembersResponseBody:
      additionalProperties: false
      properties:
        members:
          items:
            $ref: "#/components/schemas/MemberRow"
          type:
            - array
            - "null"
      required:
        - members
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    LoginResponseBody:
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionInfo"
        user:
          $ref: "#/components/schemas/UserInfo"
      required:
        - authenticated
        - user
      type: object
    MemberActionBody:
      additionalProperties: false
      properties:
        account_id:
          type: string
        email:
          type: string
        organization_id:
          type: string
        role:
          type: string
      required:
        - account_id
        - organization_id
        - role
        - email
      type: object
    MemberRow:
      additionalProperties: false
      properties:
        account_id:
          type: string
        display_name:
          type:
            - string
            - "null"
        email:
          type: string
        email_verified_at:
          format: date-time
          type: string
        lastname:
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
        organization_id:
          type: string
        role:
          type: string
      required:
        - account_id
        - organization_id
        - role
        - email
        - name
        - lastname
        - display_name
      type: object
    OrganizationDeleteRequest:
      additionalProperties: false
      properties:
        confirmation_key:
          type: string
      required:
        - confirmation_key
      type: object
    OrganizationPatchRequest:
      additionalProperties: false
      properties:
        display_name:
          type: string
      required:
        - display_name
      type: object
    OrganizationProfileBody:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        display_name:
          type: string
        organization_id:
          type: string
        organization_key:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
        - organization_id
        - organization_key
        - display_name
        - created_at
        - updated_at
      type: object
    PatchMemberRoleRequest:
      additionalProperties: false
      properties:
        role:
          type: string
      required:
        - role
      type: object
    PatchProfileResponseBody:
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/UserInfo"
      required:
        - authenticated
        - user
      type: object
    PreviewInvitationResponseBody:
      additionalProperties: false
      properties:
        account_exists:
          type: boolean
        email:
          type: string
        expires_at:
          format: date-time
          type: string
        needs_password:
          type: boolean
        organization_id:
          type: string
        organization_key:
          type: string
        organization_name:
          type: string
        role:
          type: string
      required:
        - email
        - role
        - organization_id
        - organization_key
        - organization_name
        - expires_at
        - account_exists
        - needs_password
      type: object
    ProfileRequest:
      additionalProperties: false
      properties:
        display_name:
          type: string
        lastname:
          type: string
        name:
          type: string
      type: object
    RefreshResponseBody:
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionInfo"
        user:
          $ref: "#/components/schemas/UserInfo"
      required:
        - authenticated
        - user
        - session
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        organization_name:
          type: string
        password:
          type: string
      required:
        - email
        - password
        - organization_name
      type: object
    RegisterResponseBody:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    RegistrationStageBody:
      additionalProperties: false
      properties:
        stage:
          type: string
      required:
        - stage
      type: object
    RemoveMemberResponseBody:
      additionalProperties: false
      properties:
        account_id:
          type: string
        email:
          type: string
        organization_id:
          type: string
        role:
          type: string
        status:
          type: string
      required:
        - account_id
        - organization_id
        - role
        - email
        - status
      type: object
    ResendInvitationResponseBody:
      additionalProperties: false
      properties:
        invitation_id:
          type: string
        organization_id:
          type: string
        status:
          type: string
      required:
        - status
        - invitation_id
        - organization_id
      type: object
    SessionExpiry:
      additionalProperties: false
      properties:
        expires_at:
          format: date-time
          type: string
      required:
        - expires_at
      type: object
    SessionInfo:
      additionalProperties: false
      properties:
        bearer:
          type: string
        expires_at:
          format: date-time
          type: string
      required:
        - bearer
        - expires_at
      type: object
    SessionResponseBody:
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionExpiry"
        user:
          $ref: "#/components/schemas/UserInfo"
      required:
        - authenticated
        - user
        - session
      type: object
    SystemAccessCheckResponseBody:
      additionalProperties: false
      properties:
        platform_super_admin:
          type: boolean
      required:
        - platform_super_admin
      type: object
    UserInfo:
      additionalProperties: false
      properties:
        account_id:
          type: string
        display_name:
          type:
            - string
            - "null"
        email:
          type: string
        is_platform_super_admin:
          type: boolean
        lastname:
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
        organization_id:
          type: string
        organization_key:
          type: string
        organization_name:
          type: string
        role:
          type: string
      required:
        - account_id
        - organization_id
        - organization_key
        - organization_name
        - role
        - email
        - is_platform_super_admin
        - name
        - lastname
        - display_name
      type: object
    VerifyRequest:
      additionalProperties: false
      properties:
        token:
          type: string
      required:
        - token
      type: object
    VerifyResponseBody:
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        session:
          $ref: "#/components/schemas/SessionInfo"
        status:
          type: string
        user:
          $ref: "#/components/schemas/UserInfo"
      required:
        - authenticated
      type: object
    WireError:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/WireErrorBody"
      required:
        - error
      type: object
    WireErrorBody:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
      type: object
info:
  title: go-mivia identity auth (pilot)
  version: v2
openapi: 3.1.0
paths:
  /api/v2/auth/login:
    post:
      operationId: auth-login
      parameters:
        - in: header
          name: X-Mivia-Auth-Transport
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Authenticate with email + password
  /api/v2/auth/logout:
    post:
      operationId: auth-logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Clear the session cookie
  /api/v2/auth/organization:
    delete:
      operationId: auth-delete-organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationDeleteRequest"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Delete the caller's organization (owner only)
    get:
      operationId: auth-get-organization
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationProfileBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Get the caller's organization profile
    patch:
      operationId: auth-patch-organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationPatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationProfileBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Rename the caller's organization
  /api/v2/auth/organizations/invitations:
    get:
      operationId: auth-list-invitations
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListInvitationsResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: List the caller's organization's open invitations
    post:
      operationId: auth-create-invitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInvitationResponseBody"
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Invite an email into the caller's organization
  /api/v2/auth/organizations/invitations/accept:
    post:
      operationId: auth-accept-invitation
      parameters:
        - in: header
          name: X-Mivia-Auth-Transport
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: "Public: accept an invitation, minting a session"
  /api/v2/auth/organizations/invitations/preview:
    get:
      operationId: auth-preview-invitation
      parameters:
        - explode: false
          in: query
          name: token
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewInvitationResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: "Public: preview an invitation by token (no account oracle)"
  /api/v2/auth/organizations/invitations/{invitation_id}/resend:
    post:
      operationId: auth-resend-invitation
      parameters:
        - in: path
          name: invitation_id
          required: true
          schema:
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendInvitationResponseBody"
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Resend (supersede) an open invitation
  /api/v2/auth/organizations/invitations/{invitation_id}/revoke:
    post:
      operationId: auth-revoke-invitation
      parameters:
        - in: path
          name: invitation_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationActionResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Revoke an open invitation
  /api/v2/auth/organizations/members:
    get:
      operationId: auth-list-members
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListMembersResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: List the caller's organization members
  /api/v2/auth/organizations/members/{account_id}:
    delete:
      operationId: auth-remove-member
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveMemberResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Remove another member from the organization
    patch:
      operationId: auth-patch-member-role
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMemberRoleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberActionBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Update another member's role
  /api/v2/auth/organizations/{organization_id}/probe:
    get:
      operationId: auth-organization-probe
      parameters:
        - in: path
          name: organization_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Probe whether the caller belongs to organization_id
  /api/v2/auth/profile:
    patch:
      operationId: auth-patch-profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatchProfileResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Update the caller's own profile fields
  /api/v2/auth/refresh:
    post:
      operationId: auth-refresh
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponseBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Rotate a CLI bearer
  /api/v2/auth/register:
    post:
      operationId: auth-register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponseBody"
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Begin registration (no session)
  /api/v2/auth/registration-stage:
    get:
      operationId: auth-registration-stage
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationStageBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Public registration stage probe
  /api/v2/auth/revoke:
    post:
      operationId: auth-revoke
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Revoke the presented CLI bearer
  /api/v2/auth/session:
    get:
      operationId: auth-session
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Resolve the caller's established session
  /api/v2/auth/verify:
    post:
      operationId: auth-verify
      parameters:
        - in: header
          name: X-Mivia-Auth-Transport
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponseBody"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Verify a registration/invitation bearer
  /api/v2/system/access-check:
    get:
      operationId: system-access-check
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAccessCheckResponseBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WireError"
          description: Error
      summary: Platform super_admin gate probe
