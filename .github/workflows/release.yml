name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    name: validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || {
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          commit="$(git rev-parse --short=12 HEAD)"
          pkg="$(go list -m)/internal/version"
          binary="mivia"
          [[ "$GOOS" == windows ]] && binary="mivia.exe"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          output="mivia_${version}_${GOOS}_${GOARCH}"
          mkdir -p "$work/$output"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.Dirty=clean" \
            -o "$work/$output/$binary" ./cmd/mivia
          version_output="$(env -u GOOS -u GOARCH CGO_ENABLED=0 go run -trimpath \
            -ldflags "-X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.Dirty=clean" \
            ./cmd/mivia version --json)"
          VERSION_OUTPUT="$version_output" EXPECTED_VERSION="$version" python3 - <<'PY'
          import json
          import os
          data = json.loads(os.environ["VERSION_OUTPUT"])
          assert data["binary"] == "mivia"
          assert data["version"] == os.environ["EXPECTED_VERSION"]
          PY
          grep -a -F "$version" "$work/$output/$binary" >/dev/null
          cp README.md LICENSE "$work/$output/"
          if [[ "$GOOS" == windows ]]; then
            (cd "$work/$output" && zip -q -X "$GITHUB_WORKSPACE/${output}.zip" "$binary" README.md LICENSE)
            archive="${output}.zip"
          else
            tar -C "$work/$output" -czf "$GITHUB_WORKSPACE/${output}.tar.gz" "$binary" README.md LICENSE
            archive="${output}.tar.gz"
          fi
          test -s "$GITHUB_WORKSPACE/$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Attest archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: mivia_*
      - uses: actions/upload-artifact@v4
        with:
          name: mivia-${{ matrix.goos }}-${{ matrix.goarch }}
          path: mivia_*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for archive in \
            "mivia_${version}_linux_amd64.tar.gz" \
            "mivia_${version}_linux_arm64.tar.gz" \
            "mivia_${version}_darwin_amd64.tar.gz" \
            "mivia_${version}_darwin_arm64.tar.gz" \
            "mivia_${version}_windows_amd64.zip" \
            "mivia_${version}_windows_arm64.zip"; do
            test -s "dist/$archive"
          done
          test "$(find dist -maxdepth 1 -type f \( -name 'mivia_*.tar.gz' -o -name 'mivia_*.zip' \) | wc -l)" -eq 6
          (cd dist && sha256sum mivia_*) > dist/checksums.txt
          (cd dist && sha256sum -c checksums.txt)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          release_args=(
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --title "mivia ${GITHUB_REF_NAME#v}"
            --generate-notes
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease --latest=false)
          fi
          gh release create "${GITHUB_REF_NAME}" "${release_args[@]}" mivia_* checksums.txt
