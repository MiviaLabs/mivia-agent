name: release

# Builds release binaries for every supported platform on a version tag and
# publishes a GitHub Release with checksums. Trigger: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          commit="$(git rev-parse --short HEAD)"
          pkg="$(go list -m)/internal/version"
          exe="mivia"
          [ "${GOOS}" = "windows" ] && exe="mivia.exe"
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X ${pkg}.Version=${tag} -X ${pkg}.Commit=${commit} -X ${pkg}.Dirty=clean" \
            -o "dist/${exe}" ./cmd/mivia
      - uses: actions/upload-artifact@v4
        with:
          name: mivia-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten and checksum
        run: |
          find dist -type f \( -name 'mivia' -o -name 'mivia.exe' \) -exec mv {} dist/ \;
          cd dist
          sha256sum mivia* > checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "${GITHUB_REF_NAME}" \
            --title "mivia ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            mivia* checksums.txt
