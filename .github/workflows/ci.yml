name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: chmod scripts
        run: |
          chmod +x scripts/*.py scripts/*.sh scripts/git-hooks/* .githooks/* || true
      - name: Verify control surface and gates
        run: make verify
      - name: Race (packages)
        run: make race
