name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: chmod scripts
        run: |
          chmod +x scripts/*.py scripts/*.sh scripts/git-hooks/* .githooks/* || true
      - name: Prepare isolated test home
        run: |
          test_home="$RUNNER_TEMP/mivia-home"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          module_cache="$(go env GOMODCACHE)"
          mkdir -p "$test_home"
          mkdir -p "$test_home/.mivia"
          : > "$test_home/.mivia/.env"
          mkdir -p "$test_home/go/pkg"
          ln -s "$module_cache" "$test_home/go/pkg/mod"
      - name: Verify control surface and gates
        run: make verify
      - name: Invariant validation
        run: make validate-invariants && make invariants
      - name: Race (packages)
        run: make race

  # macOS runs the full POSIX gate suite (make works on macOS runners).
  verify-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: chmod scripts
        run: |
          chmod +x scripts/*.py scripts/*.sh scripts/git-hooks/* .githooks/* || true
      - name: Prepare isolated test home
        run: |
          test_home="$RUNNER_TEMP/mivia-home"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          module_cache="$(go env GOMODCACHE)"
          mkdir -p "$test_home"
          mkdir -p "$test_home/.mivia"
          : > "$test_home/.mivia/.env"
          mkdir -p "$test_home/go/pkg"
          ln -s "$module_cache" "$test_home/go/pkg/mod"
      - name: Verify control surface and gates
        run: make verify
      - name: Invariant validation
        run: make validate-invariants && make invariants
      - name: Race (packages)
        run: make race

  # Windows runs Go build + tests only. The make-based gates are POSIX shell
  # scripts and are not portable; the Go toolchain is the portable core.
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build
        run: go build ./...
      - name: Prepare isolated test home
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'mivia-home'
          "HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "USERPROFILE=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GOPATH=$(go env GOPATH)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$testHome\.mivia" | Out-Null
          New-Item -ItemType File -Force -Path "$testHome\.mivia\.env" | Out-Null
      - name: Test
        run: go test ./... -run '^$'
