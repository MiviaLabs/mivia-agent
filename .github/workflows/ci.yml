name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: chmod scripts
        run: |
          chmod +x scripts/*.py scripts/*.sh scripts/git-hooks/* .githooks/* || true
      - name: Install workflow verifier sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap ripgrep
      # bwrap --unshare-all needs unprivileged user namespaces. GitHub's
      # Ubuntu 24.04 image restricts them with AppArmor by default.
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Check required tools
        # Run this check after setup. It gives a clear failure when a runner
        # image no longer provides a required tool.
        run: |
          for tool in go git python3 rg semgrep bwrap; do
            command -v "$tool" >/dev/null || { echo "missing required tool: $tool"; exit 1; }
          done
      - name: Prepare isolated test home
        run: |
          ci_root="$(mktemp -d /tmp/mivia-ci.XXXXXX)"
          test_home="$ci_root/home"
          test_tmp="$ci_root/tmp"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
          echo "TMPDIR=$test_tmp" >> "$GITHUB_ENV"
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          module_cache="$(go env GOMODCACHE)"
          mkdir -p "$test_home" "$test_tmp" "$test_home/.mivia" "$test_home/go/pkg"
          : > "$test_home/.mivia/.env"
          ln -s "$module_cache" "$test_home/go/pkg/mod"
      - name: Verify pull request
        run: make verify

  verify-master:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: chmod scripts
        run: |
          chmod +x scripts/*.py scripts/*.sh scripts/git-hooks/* .githooks/* || true
      - name: Install workflow verifier sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap ripgrep
      # bwrap --unshare-all needs unprivileged user namespaces. GitHub's
      # Ubuntu 24.04 image restricts them with AppArmor by default.
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Check required tools
        # Run this check after setup. It gives a clear failure when a runner
        # image no longer provides a required tool.
        run: |
          for tool in go git python3 rg semgrep bwrap; do
            command -v "$tool" >/dev/null || { echo "missing required tool: $tool"; exit 1; }
          done
      - name: Prepare isolated test home
        run: |
          ci_root="$(mktemp -d /tmp/mivia-ci.XXXXXX)"
          test_home="$ci_root/home"
          test_tmp="$ci_root/tmp"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
          echo "TMPDIR=$test_tmp" >> "$GITHUB_ENV"
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          module_cache="$(go env GOMODCACHE)"
          mkdir -p "$test_home" "$test_tmp" "$test_home/.mivia" "$test_home/go/pkg"
          : > "$test_home/.mivia/.env"
          ln -s "$module_cache" "$test_home/go/pkg/mod"
      - name: Verify control surface and gates
        run: make verify
      - name: Invariants and race detector
        run: make invariants && make race

  verify-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Test, vet, and build
        run: |
          go test ./... -count=1
          go vet ./...
          go build ./...

  verify-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Check required tools
        shell: pwsh
        run: |
          foreach ($t in @('go', 'git', 'python3', 'pwsh')) {
            if (-not (Get-Command $t -ErrorAction SilentlyContinue)) {
              Write-Error "missing required tool: $t"
              exit 1
            }
          }
      # Use a long-name temp path. Go and Git then agree on the canonical path.
      # Isolate the user profile so tests do not read the runner profile.
      - name: Prepare isolated test home and long-name temp directory
        shell: pwsh
        run: |
          $ciRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'mivia-ci-temp'
          $temp = Join-Path $ciRoot 'tmp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          # $home is a read-only PowerShell variable.
          $userHome = Join-Path $ciRoot 'home'
          New-Item -ItemType Directory -Force -Path (Join-Path $userHome '.mivia') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $userHome '.mivia\.env') | Out-Null
          "USERPROFILE=$userHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HOME=$userHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          $gomodcache = & go env GOMODCACHE
          $gocache = & go env GOCACHE
          "GOMODCACHE=$gomodcache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GOCACHE=$gocache" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test, vet, and build
        run: |
          go test ./... -count=1
          go vet ./...
          go build ./...
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Test PowerShell installer
        shell: pwsh
        run: ./scripts/test_installers.ps1

  cross-compile:
    if: github.event_name == 'push'
    name: cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Compile release target
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/mivia-${GOOS}-${GOARCH}"
          [[ "$GOOS" == windows ]] && output="${output}.exe"
          CGO_ENABLED=0 go build -trimpath -o "$output" ./cmd/mivia
          test -s "$output"
