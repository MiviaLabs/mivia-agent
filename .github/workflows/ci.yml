name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HOME: ${{ runner.temp }}/mivia-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: chmod scripts
        run: |
          chmod +x scripts/*.py scripts/*.sh scripts/git-hooks/* .githooks/* || true
      - name: Prepare isolated test home
        run: |
          mkdir -p "$HOME/.mivia"
          : > "$HOME/.mivia/.env"
      - name: Verify control surface and gates
        run: make verify
      - name: Invariant validation
        run: make validate-invariants && make invariants
      - name: Race (packages)
        run: make race

  # macOS runs the full POSIX gate suite (make works on macOS runners).
  verify-macos:
    runs-on: macos-latest
    env:
      HOME: ${{ runner.temp }}/mivia-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: chmod scripts
        run: |
          chmod +x scripts/*.py scripts/*.sh scripts/git-hooks/* .githooks/* || true
      - name: Prepare isolated test home
        run: |
          mkdir -p "$HOME/.mivia"
          : > "$HOME/.mivia/.env"
      - name: Verify control surface and gates
        run: make verify
      - name: Invariant validation
        run: make validate-invariants && make invariants
      - name: Race (packages)
        run: make race

  # Windows runs Go build + tests only. The make-based gates are POSIX shell
  # scripts and are not portable; the Go toolchain is the portable core.
  verify-windows:
    runs-on: windows-latest
    env:
      HOME: ${{ runner.temp }}\mivia-home
      USERPROFILE: ${{ runner.temp }}\mivia-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build
        run: go build ./...
      - name: Prepare isolated test home
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.mivia" | Out-Null
          New-Item -ItemType File -Force -Path "$env:USERPROFILE\.mivia\.env" | Out-Null
      - name: Test
        run: go test ./... -run '^$'
