name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Group by pull request number, or by ref for pushes. A superseded run gives
# no signal: only the tip of the branch must stay verified.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Verify pull request
        run: make verify

  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint commit subjects
        run: scripts/ci-commit-lint.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  verify-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Verify control surface and gates
        run: make verify

  # Main only. These gates are slow, they do not gate a merge, and each one
  # re-runs the whole repository test profile - so they run in separate
  # parallel jobs rather than one job's sequential steps, one runner apiece,
  # instead of stacking three full-suite runs on top of `make verify` on a
  # single shared runner.
  verify-main-invariants:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Invariants
        run: make invariants

  verify-main-race:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      - name: Race detector
        run: make race

  verify-main-verifier-integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
      # The sandbox mounts GOMODCACHE read-only, so every module the
      # sandboxed `go test` needs must already be on disk before it starts.
      - name: Warm module cache
        run: go mod download
      - name: Verifier integration sandbox profile
        run: make verifier-integration

  verify-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Prepare isolated test home
        run: |
          ci_root="$(mktemp -d /private/tmp/mivia-ci.XXXXXX)"
          test_home="$ci_root/home"
          test_tmp="$ci_root/tmp"
          echo "HOME=$test_home" >> "$GITHUB_ENV"
          echo "TMPDIR=$test_tmp" >> "$GITHUB_ENV"
          echo "GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
          module_cache="$(go env GOMODCACHE)"
          mkdir -p "$test_home" "$test_tmp" "$test_home/.mivia" "$test_home/go/pkg"
          : > "$test_home/.mivia/.env"
          ln -s "$module_cache" "$test_home/go/pkg/mod"
      # Runs AFTER the isolated test home swaps HOME, since `go env -w`
      # writes to a HOME-keyed config file: written before the swap, the
      # later build/test step (running under the new HOME) would never see it.
      - name: Set GOPRIVATE for MiviaLabs modules
        run: go env -w GOPRIVATE=github.com/MiviaLabs/*
      - name: Test, vet, and build
        run: |
          go test ./... -count=1
          go vet ./...
          go build ./...

  verify-windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Check required tools
        shell: pwsh
        run: |
          foreach ($t in @('go', 'git', 'python3', 'pwsh')) {
            if (-not (Get-Command $t -ErrorAction SilentlyContinue)) {
              Write-Error "missing required tool: $t"
              exit 1
            }
          }
      # Use a long-name temp path. Go and Git then agree on the canonical path.
      # Isolate the user profile so tests do not read the runner profile.
      - name: Prepare isolated test home and long-name temp directory
        shell: pwsh
        run: |
          $ciRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'mivia-ci-temp'
          $temp = Join-Path $ciRoot 'tmp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append
          # $home is a read-only PowerShell variable.
          $userHome = Join-Path $ciRoot 'home'
          New-Item -ItemType Directory -Force -Path (Join-Path $userHome '.mivia') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $userHome '.mivia\.env') | Out-Null
          "USERPROFILE=$userHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          "HOME=$userHome" | Out-File -FilePath $env:GITHUB_ENV -Append
          $gomodcache = & go env GOMODCACHE
          $gocache = & go env GOCACHE
          "GOMODCACHE=$gomodcache" | Out-File -FilePath $env:GITHUB_ENV -Append
          "GOCACHE=$gocache" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Runs AFTER the isolated test home swaps HOME/USERPROFILE, since
      # `go env -w` writes to a HOME-keyed config file: written before the
      # swap, the later build/test step (running under the new HOME) would
      # never see it.
      - name: Set GOPRIVATE for MiviaLabs modules
        run: go env -w GOPRIVATE=github.com/MiviaLabs/*
      # Three separate steps, not one pwsh run block: a multi-line pwsh
      # block only fails the step on the LAST command's exit code, which let
      # a failing `go test` hide behind a passing `go build` (go build skips
      # _test.go files, so test-only compile errors never reach it).
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw ($errors | Out-String) }
      - name: Test PowerShell installer
        shell: pwsh
        run: ./scripts/test_installers.ps1

  # One job compiles every release target. A build takes seconds, but a runner
  # takes minutes to start. A loop is much faster than a matrix here.
  cross-compile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.x"
      - name: Set GOPRIVATE for MiviaLabs modules
        run: go env -w GOPRIVATE=github.com/MiviaLabs/*
      - name: Compile release targets
        shell: bash
        run: |
          set -euo pipefail
          failed=()
          for target in \
            linux/amd64 linux/arm64 \
            darwin/amd64 darwin/arm64 \
            windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            output="$RUNNER_TEMP/mivia-${goos}-${goarch}"
            [[ "$goos" == windows ]] && output="${output}.exe"
            echo "::group::$target"
            # Report every broken target, not only the first one. This matches
            # the fail-fast: false behaviour of the matrix it replaces.
            if CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -o "$output" ./cmd/mivia && test -s "$output"; then
              echo "ok: $target"
            else
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "failed targets: ${failed[*]}" >&2
            exit 1
          fi
