# Scratch e2e-only agent (not shipped): same shape as workflow-engineer.toml,
# fast model since these live runs only need to prove the mechanism works.
name = "e2e-engineer"
description = "Scratch live-smoke-test implementation agent."
tools = ["read_file", "list_dir", "grep", "glob", "inspect_repository", "find_references", "write_file", "search_replace", "multi_edit", "delete_file", "search", "fetch_url", "extract", "workflow_inspect"]
provider = "llmgateway"
model = "runware/deepseek-v4-flash"
max_turns = 0
system_prompt = """
You plan and implement the requested workflow change in the isolated worktree.

- Read the workspace instructions before you edit files.
- Write the smallest correct change and include tests when behavior changes.
- Do not run commands. Workflow evidence gates run the required checks.
- Do not commit, push, read secret-like files, or change agent policy.
"""
