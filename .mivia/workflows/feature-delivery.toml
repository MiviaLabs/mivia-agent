version = 1
name = "feature-delivery"
description = "Plan, challenge plan, plan tests, review test plan, implement (with tests), review, validate tests, verify code, and validate results."
initial_step = "plan"

[inputs.task]
type = "string"
required = true
max_bytes = 12000

[limits]
# Up to the system cap (24h) so delivery workflows can host very long-running
# agent tasks end to end. Attempt and loop caps are generous so the 24h
# duration bound, not iteration counts, governs long repair cycles.
max_step_attempts = 5000
max_duration_seconds = 86400
# max_on_failure_reentries bounds how many times ONE step may re-enter its
# declared non-terminal on_failure (repair) target after genuine failures.
# 0 (or omitting the key) means the controller default of 3. review_panel
# below declares a self-loop on_failure, so a failed panel attempt re-runs
# its members up to this budget before the run fails. Set the panel's
# on_failure back to "failure" to disable panel retries entirely.
max_on_failure_reentries = 3

# Stacking is opt-in: this table (with the required plan_step/implement_step)
# puts the workflow in the stacking engine. All other knobs use the
# engine's global defaults (max_chunks=12, soft_lines=200, hard_lines=400,
# max_files=5). merge_policy=auto: the run publishes each chunk PR and merges
# it itself (mark ready -> CI green -> squash-merge) - a 100-chunk stack needs
# zero human merges. Set merge_policy="approve" to keep the human publish
# grant per PR instead.
[stacking]
plan_step = "plan"
implement_step = "implement"
merge_policy = "auto"
split_deferred = true

# [step_defaults] desugars at decode time into every step whose own field is
# empty: kind, agent, skill, output_schema, and on_failure below fill the
# agent steps (plan, plan_tests, implement, the repairs). A step that needs a
# different value - plan/plan_tests (plan schema), review_panel (self-loop
# on_failure), the gates - declares its own field, which always wins.
# template and context are step-specific and stay on each step.
[step_defaults]
kind = "agent"
agent = "workflow-engineer"
skill = "workflow-feature-delivery"
output_schema = "schemas/change-summary-v1.json"
on_failure = "failure"

[[steps]]
id = "plan"
template = "templates/plan.md"
output_schema = "schemas/plan-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan_review.output", as = "review_findings", max_bytes = 4096, optional = true, envelope_only = true },
]

[[steps]]
id = "plan_review"
kind = "agent_gate"
agent = "reviewer"
skill = "secure-change"
template = "templates/plan-review.md"
output_schema = "schemas/review-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_review.output", as = "prior_findings", max_bytes = 4096, optional = true, envelope_only = true },
]
on_failure = "failure"

[[steps]]
id = "plan_tests"
template = "templates/plan-tests.md"
output_schema = "schemas/plan-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.test_plan_review.output", as = "review_findings", max_bytes = 4096, optional = true, envelope_only = true },
]

[[steps]]
id = "test_plan_review"
kind = "agent_gate"
agent = "reviewer"
skill = "secure-change"
template = "templates/plan-tests-review.md"
output_schema = "schemas/review-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.test_plan_review.output", as = "prior_findings", max_bytes = 4096, optional = true, envelope_only = true },
]
on_failure = "failure"

[[steps]]
id = "implement"
template = "templates/implement.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.review_panel.output", as = "review_findings", max_bytes = 4096, optional = true, envelope_only = true },
  { from = "steps.review_integration.output", as = "integration_findings", max_bytes = 4096, optional = true, envelope_only = true },
  { from = "inputs.chunk_plan", as = "chunk_scope", max_bytes = 4096, optional = true },
]

[[steps]]
id = "review_panel"
kind = "agent_panel"
agent = "review-synthesizer"
skill = "review-synthesis"
template = "templates/review-panel-synthesis.md"
output_schema = "schemas/review-panel-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.implement.output", as = "implementation", max_bytes = 16000 },
  { from = "implement.touched_files", as = "touched_files", max_bytes = 4096, optional = true },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.review_panel.output", as = "prior_findings", max_bytes = 4096, optional = true, envelope_only = true },
  { from = "inputs.chunk_plan", as = "chunk_scope", max_bytes = 4096, optional = true },
]
# review_panel retries: a member or synthesis failure re-enters the panel with
# a fresh attempt (all members re-run) instead of failing the run. The number
# of re-entries is bounded by [limits] max_on_failure_reentries (default 3).
# To disable panel retries, set on_failure = "failure".
on_failure = "review_panel"

[steps.panel]
# allow_partial means a single panel member failure does not fail the whole
# panel when other reviewers succeeded — the failed member is noted and the
# panel proceeds to synthesis with the successful members; the attempt fails
# only if all members fail.
failure_policy = "allow_partial"
require_distinct_bindings = true

[[steps.panel.members]]
id = "correctness"
agent = "panel-reviewer"
provider = "deepseek"
model = "deepseek-v4-flash"
skill = "panel-bug-audit"
template = "templates/review-panel-correctness.md"
output_schema = "schemas/panel-review-v1.json"

[[steps.panel.members]]
id = "security"
agent = "panel-reviewer"
provider = "openrouter"
model = "tencent/hy3-preview"
skill = "panel-secure-change"
template = "templates/review-panel-security.md"
output_schema = "schemas/panel-review-v1.json"

[[steps.panel.members]]
id = "integration"
agent = "panel-reviewer"
provider = "zai"
model = "glm-5-turbo"
skill = "panel-architecture-review"
template = "templates/review-panel-integration.md"
output_schema = "schemas/panel-review-v1.json"

[[steps]]
id = "review_integration"
kind = "agent_gate"
agent = "reviewer"
skill = "secure-change"
template = "templates/review-integration.md"
output_schema = "schemas/review-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.implement.output", as = "implementation", max_bytes = 16000 },
  { from = "steps.review_panel.output", as = "review", max_bytes = 16000, optional = true },
  { from = "steps.review_integration.output", as = "prior_findings", max_bytes = 4096, optional = true, envelope_only = true },
  { from = "inputs.chunk_plan", as = "chunk_scope", max_bytes = 4096, optional = true },
]
on_failure = "failure"

[[steps]]
id = "repair_tests"
template = "templates/repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.test_validate.output", as = "failed_evidence", max_bytes = 32768 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

[[steps]]
id = "repair_verify"
template = "templates/repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.verify.output", as = "failed_evidence", max_bytes = 32768 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

[[steps]]
id = "repair_final"
template = "templates/repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.code_validate.output", as = "failed_evidence", max_bytes = 32768 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

[[steps]]
id = "repair_preflight"
template = "templates/repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.preflight_validate.output", as = "failed_evidence", max_bytes = 32768 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

[[steps]]
id = "repair_preflight_structure"
template = "templates/repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "steps.preflight_structure.output", as = "failed_evidence", max_bytes = 32768 },
  # A delivery rejection (the common commit-hook refusal) routes here via
  # delivery.on_failure. The rejection text must reach the repair agent
  # deterministically as delivery_hint: without it, this step sees only the
  # PASSING gate output and delivery re-fails identically forever. The
  # compiler refuses a delivery re-entry step that omits this binding.
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

# repair_pr_metadata fixes only the PR title and summary when the host
# rejects the agent's change-summary metadata (pr_title/pr_summary). The host
# sends the rejection hint as delivery.failure evidence; the step rewrites the
# metadata and feeds back through review, so the run converges and delivers.
[[steps]]
id = "repair_pr_metadata"
template = "templates/repair-pr-metadata.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 12000 },
  { from = "steps.plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.plan_tests.output", as = "test_plan", max_bytes = 16000 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 8192, optional = true },
]

[[steps]]
id = "test_validate"
kind = "evidence_gate"
verifier = "go-test"
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

[[steps]]
id = "verify"
kind = "evidence_gate"
verifier = "go-verify"
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

[[steps]]
id = "code_validate"
kind = "evidence_gate"
verifier = "go-final"
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

# preflight_validate runs the project's own final gate inside the verifier
# sandbox (bare executable + argv, never a shell string). This is what makes
# the workflow project-agnostic: any repository declares its real pre-push
# gate here, and a failure routes to repair_preflight with the evidence.
[[steps]]
id = "preflight_validate"
kind = "evidence_gate"
command = { check = "invariants", program = "python3", args = ["scripts/validate_invariants.py"] }
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

# preflight_structure runs the repository's structure gate (check_go_structure
# --strict --worktree) inside the sandbox so a change that passes go
# test/vet/race but violates the project's own layout policy is caught in-loop:
# the failed evidence routes to repair_preflight_structure and the agent fixes
# it before delivery, instead of the delivery pre-commit hook hard-failing
# publication. The gate uses --worktree, not --all: workflow agents write files
# without git add, and the sandbox git index is empty (git init, nothing
# staged), so --all (git ls-files) checks zero files and a new untracked test
# file is invisible. --worktree scans the filesystem like a fresh checkout
# (tracked and untracked), so the real tree is what the gate judges.
[[steps]]
id = "preflight_structure"
kind = "evidence_gate"
command = { check = "go-structure", program = "python3", args = ["scripts/check_go_structure.py", "--strict", "--worktree"] }
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

# plan → plan_review (challenge the plan)
[[transitions]]
from = "plan"
to = "plan_review"
match = { status = "succeeded" }

# plan_review → plan_tests (plan approved, plan tests next)
[[transitions]]
from = "plan_review"
to = "plan_tests"
match = { status = "succeeded", output = { verdict = "approved" } }

# plan_review → plan (changes requested, unbounded repair loop)
[[transitions]]
from = "plan_review"
to = "plan"
match = { status = "succeeded", output = { verdict = "changes_requested" } }
loop = "plan_review_repair"
max_iterations = 5

# plan_tests → test_plan_review (test plan ready, review it)
[[transitions]]
from = "plan_tests"
to = "test_plan_review"
match = { status = "succeeded" }

# test_plan_review → implement (test plan approved, implement)
[[transitions]]
from = "test_plan_review"
to = "implement"
match = { status = "succeeded", output = { verdict = "approved" } }

# test_plan_review → plan_tests (changes requested, revise test plan)
[[transitions]]
from = "test_plan_review"
to = "plan_tests"
match = { status = "succeeded", output = { verdict = "changes_requested" } }
loop = "test_plan_review_repair"
max_iterations = 5

# implement → review_panel (implementation + tests ready for review)
[[transitions]]
from = "implement"
to = "review_panel"
match = { status = "succeeded" }

# review_panel → review_integration (panel approved, cross-layer gate next)
[[transitions]]
from = "review_panel"
to = "review_integration"
match = { status = "succeeded", output = { host_verdict = "approved" } }

# review_integration → test_validate (cross-layer review approved, validate tests pass)
[[transitions]]
from = "review_integration"
to = "test_validate"
match = { status = "succeeded", output = { verdict = "approved" } }

# review_integration → implement (cross-layer changes requested, repair loop)
[[transitions]]
from = "review_integration"
to = "implement"
match = { status = "succeeded", output = { verdict = "changes_requested" } }
loop = "integration_repair"
max_iterations = 8

# review_panel → implement (panel changes requested, unbounded repair loop)
[[transitions]]
from = "review_panel"
to = "implement"
match = { status = "succeeded", output = { host_verdict = "changes_requested" } }
loop = "review_repair"
max_iterations = 8

# test_validate → verify (tests pass, verify code quality)
[[transitions]]
from = "test_validate"
to = "verify"
match = { status = "succeeded", output = { status = "passed" } }

[[transitions]]
from = "test_validate"
to = "repair_tests"
match = { status = "failed" }
loop = "test_repair"
max_iterations = 5

[[transitions]]
from = "repair_tests"
to = "review_panel"
match = { status = "succeeded" }

# verify → code_validate (verification passed, final validation gate)
[[transitions]]
from = "verify"
to = "code_validate"
match = { status = "succeeded", output = { status = "passed" } }

[[transitions]]
from = "verify"
to = "repair_verify"
match = { status = "failed" }
loop = "verify_repair"
max_iterations = 5

[[transitions]]
from = "repair_verify"
to = "review_panel"
match = { status = "succeeded" }

# code_validate → preflight_validate (final Go gate passed, run the project gate)
[[transitions]]
from = "code_validate"
to = "preflight_validate"
match = { status = "succeeded", output = { status = "passed" } }

[[transitions]]
from = "code_validate"
to = "repair_final"
match = { status = "failed" }
loop = "final_repair"
max_iterations = 5

[[transitions]]
from = "repair_final"
to = "review_panel"
match = { status = "succeeded" }

# preflight_validate → preflight_structure (invariants gate passed, run structure gate)
[[transitions]]
from = "preflight_validate"
to = "preflight_structure"
match = { status = "succeeded", output = { status = "passed" } }

[[transitions]]
from = "preflight_validate"
to = "repair_preflight"
match = { status = "failed" }
loop = "preflight_repair"
max_iterations = 5

[[transitions]]
from = "repair_preflight"
to = "review_panel"
match = { status = "succeeded" }

# preflight_structure → success (structure gate passed, deliver)
[[transitions]]
from = "preflight_structure"
to = "success"
match = { status = "succeeded", output = { status = "passed" } }

[[transitions]]
from = "preflight_structure"
to = "repair_preflight_structure"
match = { status = "failed" }
loop = "preflight_structure_repair"
max_iterations = 5

[[transitions]]
from = "repair_preflight_structure"
to = "review_panel"
match = { status = "succeeded" }

[[transitions]]
from = "repair_pr_metadata"
to = "review_panel"
match = { status = "succeeded" }

[delivery]
kind = "pull_request"
mode = "draft"
provider = "github"
base = "master"
title_template = "feat: {{ inputs.task }}"
# The PR title and summary come from the agent's change-summary output
# (pr_title/pr_summary). The host validates them against the PR-title policy
# before any push or PR create; a rejection routes to repair_pr_metadata,
# which rewrites only the metadata and feeds back through review.
#
# pr_title_policy is optional and defaulted: an empty value selects the
# default .mivia/policy/pr-title.toml, so this declaration is explicit.
pr_title_policy = ".mivia/policy/pr-title.toml"
# Delivery runs after the success terminal, outside the step graph. When it
# fails for a reason an agent can repair - a commit hook that rejects the
# change is the common one - the run returns to this step instead of stopping
# with all of its work done. The step repairs the change, the run reaches
# success again, and delivery runs again. The step MUST bind delivery.failure
# (compiler-enforced): the rejection text is its only deterministic hint, and
# without it delivery re-fails identically forever.
on_failure = "repair_preflight_structure"
# A PR-metadata failure (the host rejected pr_title/pr_summary) routes to the
# dedicated repair step instead of the generic on_failure step.
on_pr_metadata_failure = "repair_pr_metadata"
# max_repairs bounds the delivery -> repair -> success -> delivery cycle: how
# many times a rejected delivery may route back into the repair step before
# the run settles terminal (delivery_failed) with the last rejection recorded.
# The default is 5; set it lower to fail fast or higher for stubborn gates.
max_repairs = 5
# deliver_plan_run publishes the plan run's own PR after its chunk stack has
# been driven. The default is false: the plan run settles succeeded with its
# plan and artifacts recorded in the ledger, and the chunk PRs carry the work.
deliver_plan_run = false
commit_message_template = "feat(agent): workflow delivery\n\nDelivers: {{ inputs.task }}"
