[[steps]]
id = "repair_preflight"
template = "templates/bugfix-repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.fix_plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.triage.output", as = "findings", max_bytes = 32768 },
  { from = "steps.preflight_validate.output", as = "failed_evidence", max_bytes = 32768 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

# repair_preflight_structure is also the delivery.on_failure target. It MUST
# bind delivery.failure (compiler-enforced): the rejection text is its only
# deterministic hint, and without it delivery re-fails identically forever.
[[steps]]
id = "repair_preflight_structure"
template = "templates/bugfix-repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.fix_plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.triage.output", as = "findings", max_bytes = 32768 },
  { from = "steps.preflight_structure.output", as = "failed_evidence", max_bytes = 32768 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

# repair_pr_metadata fixes only the PR title and summary when the host rejects
# the change-summary metadata. It is the delivery.on_pr_metadata_failure target
# and must bind delivery.failure. It also binds steps.implement.output as
# prior_metadata so the repair agent can see the actual pr_title/pr_summary it
# must shorten/adjust - without it, the agent has no reference for what it is
# repairing and can fabricate an unrelated pr_title/pr_summary pair (seen
# live on wfr-4UA7AUXKJBHUN3AY / PR #233, where the repaired title and body
# described work that was never implemented).
[[steps]]
id = "repair_pr_metadata"
template = "templates/bugfix-repair-metadata.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.implement.output", as = "prior_metadata", max_bytes = 4096 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 8192, optional = true },
]

# ---- Transitions ----
[[transitions]]
from = "hunt"
to = "triage"
match = { status = "succeeded" }

# triage confirmed -> fix
[[transitions]]
from = "triage"
to = "fix_plan"
match = { status = "succeeded", output = { verdict = "confirmed" } }

# triage insufficient_evidence -> refine the hunt (bounded loop)
[[transitions]]
from = "triage"
to = "hunt"
match = { status = "succeeded", output = { verdict = "insufficient_evidence" } }
loop = "triage_refinement"
max_iterations = 5

# triage no_bug -> success; the host delivery no-diff gate settles the run with
# no PR because no code changed. This is the intended clean-audit outcome.
[[transitions]]
from = "triage"
to = "success"
match = { status = "succeeded", output = { verdict = "no_bug" } }

[[transitions]]
from = "fix_plan"
to = "implement"
match = { status = "succeeded" }

# implement → test_validate (fast debug path: review_panel/review gates commented out below)
[[transitions]]
from = "implement"
to = "test_validate"
match = { status = "succeeded" }

