# ---- Host evidence gates (the repo's own gates, unchanged) ----
[[steps]]
id = "test_validate"
kind = "evidence_gate"
verifier = "go-test"
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

[[steps]]
id = "verify"
kind = "evidence_gate"
verifier = "go-verify"
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

[[steps]]
id = "code_validate"
kind = "evidence_gate"
verifier = "go-final"
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

[[steps]]
id = "preflight_validate"
kind = "evidence_gate"
command = { check = "invariants", program = "python3", args = ["scripts/validate_invariants.py"] }
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

[[steps]]
id = "preflight_structure"
kind = "evidence_gate"
command = { check = "go-structure", program = "python3", args = ["scripts/check_go_structure.py", "--strict", "--worktree"] }
output_schema = "schemas/verification-v1.json"
on_failure = "failure"

