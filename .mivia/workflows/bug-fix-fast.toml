[[steps]]
id = "repair_tests"
template = "templates/bugfix-repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.fix_plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.triage.output", as = "findings", max_bytes = 32768 },
  { from = "steps.test_validate.output", as = "failed_evidence", max_bytes = 32768 },
  { from = "delivery.failure", as = "delivery_hint", max_bytes = 32768, optional = true },
]

[[steps]]
id = "repair_verify"
template = "templates/bugfix-repair.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.fix_plan.output", as = "plan", max_bytes = 24000 },
