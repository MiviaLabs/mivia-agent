# ---- Delivery ----
[delivery]
kind = "pull_request"
mode = "draft"
provider = "github"
base = "dev"
title_template = "fix: bug-fix delivery"
pr_title_policy = ".mivia/policy/pr-title.toml"
# A delivery rejection (the common commit-hook refusal) routes here via
# delivery.on_failure; the step repairs the change and the run delivers again.
on_failure = "repair_preflight_structure"
# A PR-metadata rejection routes to the dedicated metadata repair step.
on_pr_metadata_failure = "repair_pr_metadata"
# max_repairs bounds the delivery -> repair -> success -> delivery cycle: how
# many times a rejected delivery may route back into the repair step before
# the run settles terminal (delivery_failed) with the last rejection recorded.
# The default is 5; set it lower to fail fast or higher for stubborn gates.
max_repairs = 5
# deliver_plan_run defaults to false: a stacking plan run is the stack root,
# not a deliverable, so after its chunk stack is driven the plan run settles
# succeeded and no PR is created for it (the plan and its artifacts stay
# recorded in the ledger). Set true to also publish the plan run's own PR.
deliver_plan_run = false
commit_message_template = "fix(agent): bug-fix-fast delivery\n\nDelivers: {{ inputs.scope }}\n\nRegression: none (regression coverage is added by the implement step and verified by the workflow's evidence gates)\nClass: none (workflow-delivered bug fix; the finding class is recorded in the delivery PR body)\nSweep: none (the fast hunt step's same-class sweep is optional and may have been skipped for speed; triage independently confirmed the finding)"
