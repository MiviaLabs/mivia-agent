version = 1
name = "bug-fix-fast"
description = "Fast, opportunistic hunt for at most 2 confirmed reachable performance or logic bugs in a scope (fast-bug-audit skill, not bug-audit), triage the findings, fix them with regression tests, and deliver a pull request."
initial_step = "hunt"

# ============================================================================
# TEMPORARY FAST DEBUG PATH (comment-out cut, NOT the canonical shape).
# Disabled to shorten runs while debugging/testing:
#   - review_panel (agent_panel): the 3-member panel + synthesis
#   - review (agent_gate): the post-panel review gate
#   - perf_verify (agent_gate): the conditional perf measurement gate
# implement now goes straight to test_validate, and every repair step loops
# back to test_validate instead of review_panel. The implement feedback
# bindings (steps.review.output, steps.review_panel.output) are removed.
# RESTORE: uncomment the marked step blocks and transitions below, restore
# implement -> review_panel -> review routing, restore the repair ->
# review_panel back-edges, restore implement's feedback bindings, and
# re-enable the panel assertions in internal/cli/bug_fix_panel_contract_test.go.
# ============================================================================

# bug-fix workflow design notes
# -----------------------------
# hunt   : read-only hunt (auditor + fast-bug-audit skill, run_command for
#          reproduction). fast-bug-audit trades bug-audit's exhaustive
#          invariant-first method and mandatory same-class sweep for speed:
#          jump between candidates freely, forced confirmed/dropped/
#          needs-one-check triage per candidate, sweep optional. Use this
#          workflow (not bug-fix) when a couple of quick, confident finds
#          matter more than exhaustive coverage. Findings are capped at 2 by
#          schemas/findings-v1.json (maxItems) - a machine-enforced cap.
# triage : independent confirmation gate, unchanged from bug-fix.toml (still
#          bug-audit, not fast-bug-audit) - triage is the safety net that
#          keeps the fast hunt's lower per-candidate rigor from reaching
#          implement unconfirmed. Verdicts:
#          are distinct from review's: confirmed | insufficient_evidence |
#          no_bug. no_bug routes to success; the host delivery no-diff gate then
#          settles the run with no PR (no code was changed), which is the
#          intended outcome for a clean audit.
# perf_verify : conditional measurement gate (performance + performance-review
#          skill). It runs only when the review echoes has_perf="true" (string
#          enum: transition matchers compare string values). The reviewer sets
#          has_perf from the retained findings, so the branch is reliable.
# review_panel : three independent panel-reviewer members (correctness,
#          security, integration) with distinct provider/model pairs (D4),
#          then a review-synthesizer aggregation step. The single-agent review
#          gate below is the post-panel gate: it still echoes has_perf to route
#          the conditional perf_verify step and stays the repair-loop entry.
# gates  : the repo's own gates (go-test, go-verify, go-final, invariants,
#          go-structure) - reused verbatim, never tightened.
# repairs: one repair step per evidence gate, looping back to review_panel. The
#          two delivery re-entry steps bind delivery.failure (compiler-enforced).

# [inputs.task] and [inputs.scope] max_bytes cap every step's task/scope
# context binding at 16000. This is a hard engine limit, not a style choice:
# the controller renders step context with a 256 KiB cap, and a binding larger
# than that (the historical 1048576 = 1 MiB) failed every agent step render, so
# no run could ever start. 16000 matches feature-delivery.toml and keeps the
# full task text visible to every step that needs it.
[inputs.task]
type = "string"
required = true
max_bytes = 16000

[inputs.scope]
type = "string"
required = true
max_bytes = 16000

[limits]
# No global caps: max_step_attempts=0 is unlimited and max_duration_seconds=0
# sets no run deadline, so long 24h+ agentic reviews and tasks are the intended
# workload. Every cycle in this workflow is a bounded loop, so execution is
# finite by construction even with both limits at 0.
# max_on_failure_reentries bounds how many times ONE step may re-enter its
# on_failure target (0 or omitting the key means the controller default of 3).
# review_panel re-enters itself on member/synthesis failure, so it is pinned
# explicitly like feature-delivery's review_panel.
max_step_attempts = 0
max_duration_seconds = 0
max_on_failure_reentries = 3

# Stacking is opt-in: this table (with the required plan_step/implement_step)
# puts the workflow in the stacking engine. max_chunks=20 (raised from the
# engine default 12 so large plans may split into up to 20 chunks).
# soft_lines=350 (raised from the engine default 200 so medium changes stay
# one chunk/PR; hard_lines keeps the engine default 400 as the hard ceiling).
# max_files uses the engine default 5. merge_policy=approve (changed from
# auto on 2026-08-18 to match feature-delivery.toml's 2026-08-17 fix: a
# merged chunk PR must never land without a human merging it, including for a
# bug-fix run - a confirmed, regression-tested fix is still not exempt from
# human publish grant). merge_policy="auto" would let the run merge each
# chunk PR itself; revert only deliberately.
[stacking]
plan_step = "fix_plan"
implement_step = "implement"
split_deferred = true
merge_policy = "approve"
max_chunks = 20
soft_lines = 350

# [step_defaults] desugars at decode time into every step whose own field is
# empty: kind, agent, skill, output_schema, and on_failure below fill the
# agent steps (fix_plan, implement, the repairs). A step that needs a
# different value - hunt (auditor/bug-audit), fix_plan (plan schema),
# review_panel (self-loop on_failure), the gates - declares its own field,
# which always wins. template and context are step-specific and stay on each
# step.
[step_defaults]
kind = "agent"
agent = "workflow-engineer"
skill = "workflow-feature-delivery"
output_schema = "schemas/change-summary-v1.json"
on_failure = "failure"

# ---- Hunt: read-only hostile audit, at most 2 confirmed findings ----
[[steps]]
id = "hunt"
agent = "auditor"
skill = "fast-bug-audit"
template = "templates/bugfix-hunt-fast.md"
output_schema = "schemas/findings-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.triage.output", as = "prior_findings", max_bytes = 4096, optional = true, envelope_only = true },
]

# ---- Triage: independent confirmation of each finding ----
[[steps]]
id = "triage"
kind = "agent_gate"
agent = "reviewer"
skill = "bug-audit"
template = "templates/bugfix-triage.md"
output_schema = "schemas/triage-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.hunt.output", as = "findings", max_bytes = 32768 },
  { from = "steps.triage.output", as = "prior_findings", max_bytes = 4096, optional = true, envelope_only = true },
]
on_failure = "failure"

# ---- Fix plan: minimal change per retained finding ----
[[steps]]
id = "fix_plan"
template = "templates/bugfix-fix-plan.md"
output_schema = "schemas/plan-v1.json"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.triage.output", as = "findings", max_bytes = 32768 },
]

# ---- Implement: fix + regression tests ----
[[steps]]
id = "implement"
template = "templates/bugfix-implement.md"
context = [
  { from = "inputs.task", as = "task", max_bytes = 16000 },
  { from = "inputs.scope", as = "scope", max_bytes = 16000 },
  { from = "steps.fix_plan.output", as = "plan", max_bytes = 24000 },
  { from = "steps.triage.output", as = "findings", max_bytes = 32768 },
  # --- CUT (fast debug path): review_findings from review ---
  # { from = "steps.review.output", as = "review_findings", max_bytes = 4096, optional = true, envelope_only = true },
  # --- CUT (fast debug path): panel_findings from review_panel ---
  # { from = "steps.review_panel.output", as = "panel_findings", max_bytes = 4096, optional = true, envelope_only = true },
]

