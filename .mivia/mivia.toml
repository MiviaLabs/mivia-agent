[provider]
default_model = 'glm-5.3-flash'
name = 'zai'
# Stream watchdog bounds, raised for hard-thinking models. First-byte covers
# the silent wait before the first token (a reasoning model can think for
# minutes before it streams anything); byte-idle covers gaps between bytes
# after that. The compiled defaults (240s / 100s) are sized for chat models.
# The content-idle bound has its own key (stream_content_idle_timeout_seconds,
# default 90s); this repo keeps the default.
stream_first_byte_timeout_seconds = 600
stream_idle_timeout_seconds = 300

