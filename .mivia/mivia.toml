# =============================================================================
# mivia configuration - copy to ./.mivia/mivia.toml or ~/.mivia/mivia.toml
# =============================================================================
# Secrets (API keys) go in an env file or process environment - never here.
#   ~/.mivia/.env:
#     DEEPSEEK_API_KEY=sk-...
#     OPENROUTER_API_KEY=or-...
#     TAVILY_API_KEY=tvly-...
# =============================================================================

# ---------------------------------------------------------------------------
# PROVIDER - which LLM backend to use
# ---------------------------------------------------------------------------
# Optional: point to a file with API keys (default: ~/.mivia/.env)
env_file = "~/.mivia/.env"

[provider]
# DeepSeek everywhere: native DeepSeek API by default, DeepSeek via OpenRouter
# as the fallback (--provider openrouter).
name = "deepseek"

[providers.deepseek]
# DeepSeek v4 thinking mode: reasoning_effort high/max (low/medium→high,
# xhigh→max). Requires reasoning_content replay on tool-call turns, which the
# deepseek client implements via RequiresReasoningReplay. Default high balances
# depth and token cost for agent work.
models = [
  { name = "deepseek-v4-flash", context_window_tokens = 1000000, max_output_tokens = 384000, reasoning_efforts = ["high", "max"], reasoning = "high", reasoning_dialect = "thinking_effort" },
  { name = "deepseek-v4-pro", context_window_tokens = 1000000, max_output_tokens = 384000, reasoning_efforts = ["high", "max"], reasoning = "high", reasoning_dialect = "thinking_effort" },
]
default_model = "deepseek-v4-pro"
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/v1"

[providers.openrouter]
# Switch with: mivia --provider openrouter
# DeepSeek models via the OpenRouter unified API (deepseek/deepseek-* IDs).
# The V4 family reports a 1M+ context window and supports graded reasoning
# effort high/max; OpenRouter normalizes reasoning_effort per upstream model.
models = [
  { name = "deepseek/deepseek-v4-pro", context_window_tokens = 1000000, max_output_tokens = 384000, reasoning_efforts = ["high", "max"], reasoning = "high", reasoning_dialect = "openrouter" },
  { name = "deepseek/deepseek-v4-flash", context_window_tokens = 1000000, max_output_tokens = 384000, reasoning_efforts = ["high", "max"], reasoning = "high", reasoning_dialect = "openrouter" },
  # Reasoner: deep-thinking variant of the V4 family (deepseek-reasoner
  # legacy ID still routed on OpenRouter; maps to the V4 Flash family).
  { name = "deepseek/deepseek-reasoner", context_window_tokens = 1000000, max_output_tokens = 384000, reasoning_efforts = ["high", "max"], reasoning = "high", reasoning_dialect = "openrouter" },
]
default_model = "deepseek/deepseek-v4-pro"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"

[providers.zai]
# Switch with: mivia --provider zai
# A key works on exactly one endpoint. GLM Coding Plan keys use the coding URL
# below; pay-as-you-go keys use https://api.z.ai/api/paas/v4. Crossing them
# fails every request with code 1113 (no balance on that endpoint).
models = [
  # GLM-5.2+ supports graded reasoning_effort (low/medium→high, xhigh→max;
  # none/minimal skip thinking). thinking_preserved opts into z.ai Preserved
  # Thinking (clear_thinking:false) while still carrying reasoning_effort for
  # graded depth. Default high = balance of depth and token cost for agent work.
  { name = "glm-5.2", context_window_tokens = 200000, max_output_tokens = 128000, reasoning_efforts = ["low", "medium", "high", "max"], reasoning = "high", reasoning_dialect = "thinking_preserved" },
  # GLM-5-Turbo is deep-thinking on/off (reasoning_effort is 5.2+ for finer
  # grades). thinking_preserved enables cache-stable multi-turn reasoning when
  # effort is on. Ships off (fast) - /effort opts in. Note z.ai may ignore
  # thinking:{type:"disabled"} on some server paths.
  { name = "glm-5-turbo", context_window_tokens = 200000, max_output_tokens = 128000, reasoning_efforts = ["off", "high"], reasoning = "off", reasoning_dialect = "thinking_preserved" },
]
default_model = "glm-5-turbo"
api_key_env = "ZAI_API_KEY"
base_url = "https://api.z.ai/api/coding/paas/v4"

# ---------------------------------------------------------------------------
# AGENTS - file-backed definitions under .mivia/agents/
# ---------------------------------------------------------------------------
# One TOML file per agent (filename is the canonical name). This repo ships:
#   .mivia/agents/mivia.toml        - root orchestrator (auto-selected)
#   .mivia/agents/go-engineer.toml  - generic implementation specialist
#   .mivia/agents/researcher.toml   - read-only evidence and web research
#   .mivia/agents/reviewer.toml     - read-only engineering review
#   .mivia/agents/security.toml     - read-only security/privacy review
#   .mivia/agents/docs.toml         - owned documentation edits
#   .mivia/agents/verifier.toml     - project-native checks without writes
#   .mivia/agents/auditor.toml      - hostile bug audits with reproduction
#   .mivia/agents/performance.toml  - profiling and benchmarks without writes
#
# Workspace agent files always load from <ws>/.mivia/agents/. When no --agent
# flag is given and mivia.toml exists there, that definition is the root session
# (prompt + tool scope + skills allowlist). Select: mivia chat --agent go-engineer
#
# Agent TOML optional field skills = ["bug-audit", ...]:
#   omit → all trusted skills; skills = [] → none; list → those handlers only.
# Enforced at dispatch_tasks / spawn_agent / skill resume (plan 06 / INV-AG-30).
#
# load_workspace_config is USER-owned only (~/.mivia/mivia.toml). It does not
# live here (workspace [agents] gate values are ignored). Set it true in the
# user file to allow workspace skill handlers and workspace [chat]/[subagents]
# system prompts - not required for agent files in .mivia/agents/.

# ---------------------------------------------------------------------------
# WORKTREES - branch names for Mivia-managed Git worktrees
# ---------------------------------------------------------------------------
[worktrees]
# Mivia adds this prefix to each worktree branch name. The value must end in /.
branch_prefix = "mivia/"

# ---------------------------------------------------------------------------
# CHAT - session defaults
# ---------------------------------------------------------------------------
# Root system prompt comes from .mivia/agents/mivia.toml when present (or
# --agent <name>). Leave system_prompt unset so the agent definition wins.
[chat]
temperature = 0
# max_tokens unset - use the provider/model default response length. Setting a
# value here caps the root session's LLM responses; leaving it unset avoids
# mid-response truncation (finish_reason="length") on comprehensive turns.
max_steps = 0

# ---------------------------------------------------------------------------
# TOOLS - program allowlist, environment variable policies, size limits
# ---------------------------------------------------------------------------
# The allowlist system layers:
#   Built-in defaults (~160 programs, ~50 env vars + prefixes)
#     → run_allowlist / env_allowlist (extends defaults)
#       → run_allowlist_only / env_allowlist_only (replaces defaults entirely)
#         → run_blocklist / env_blocklist (removes from resolved list)
#
# For most projects you only need `run_allowlist` + `env_allowlist`
# to add project-specific programs and environment variables.
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
[tools]

# ---- Secret path filter (file tools only) ----
# No patterns are compiled into the binary: with these unset, nothing is
# filtered. Matched case-insensitively as substrings of the workspace-relative
# path; exceptions win over patterns.
#
# Keeps credentials out of model context by accident. NOT a boundary:
# run_command reaches the same files through a shell.
secret_path_patterns = [
    ".env",       # dotenv files (also catches .env.local, .env.production)
    ".pem",       # private key certificates
    ".key",       # private keys
    "id_rsa",     # SSH private keys
    "id_ed25519", # SSH ed25519 keys
]
secret_path_exceptions = [
    ".env.example", # a template, not a real secret
]

# ---- Program allowlist (run_command) ----
run_timeout_seconds = 900    # max wall time per run_command invocation (15 minutes per shell call)

run_allowlist = [
    # Go ecosystem
    "go", "gofmt", "goimports", "govulncheck",
    # Build & VCS
    "make", "cmake", "ninja", "git", "gh",
    # Shell / scripting
    "sh", "bash", "dash",
    # JavaScript / TypeScript
    "node", "npm", "npx", "yarn", "pnpm", "tsx",
    # Rust
    "cargo", "rustc", "rustfmt", "clippy-driver",
    # Python
    "python", "python3", "pip", "pip3", "pytest", "uv",
    # Ruby
    "ruby", "bundle", "gem", "rake",
    # PHP
    "php", "composer",
    # Java / JVM
    "java", "javac", "mvn", "gradle", "kotlin", "kotlinc",
    # .NET
    "dotnet",
    # Swift
    "swift", "swiftc",
    # Zig
    "zig",
    # Elixir / Erlang
    "elixir", "mix",
    # Haskell
    "ghc", "cabal", "stack",
    # Perl
    "perl",
    # Data processing
    "jq", "yq", "tomlq",
    # Compression / archive
    "tar", "gzip", "gunzip", "bzip2", "bunzip2", "xz", "unxz",
    "unzip", "zip", "zstd",
    # File operations
    "cat", "ls", "echo", "pwd", "which", "env",
    "rm", "cp", "mv", "mkdir", "touch", "chmod", "chown",
    "ln", "mktemp", "realpath", "readlink", "basename", "dirname",
    "install",
    # Text processing / search
    "sed", "awk", "grep", "rg", "ag", "fd",
    "head", "tail", "sort", "uniq", "wc", "cut", "tr", "fold", "fmt", "cat",
    "diff", "patch", "comm", "cmp",
    "strings", "iconv", "base64",
    # Standard Unix
    "xargs", "tee", "timeout", "nice", "nohup", "stdbuf",
    "ps", "top", "htop", "free", "df", "du",
    "date", "hostname", "uname", "arch", "nproc", "uptime",
    # Network
    "curl", "wget", "ssh", "scp",
    # Container / infra
    "docker", "kubectl", "helm", "terraform", "tofu",
    # Debug
    "strace", "ltrace", "gdb", "lldb", "dlv",
    "dmesg", "lsof",
    # SQL clients (read-only use)
    "sqlite3", "psql",
]

# Security: use run_blocklist to remove dangerous programs from the allowlist
# run_blocklist = ["sudo", "docker", "kubectl"]

# Replace the default allowlist entirely (only these programs allowed)
# run_allowlist_only = ["git", "go", "make", "sh", "cat", "ls", "echo"]

# Disable specific built-in capabilities
# disable_tools = ["web_search", "extract", "fetch_url"]

# ---- Environment variable allowlist ----
# Entries ending in "*" are prefix rules (e.g. "GIT_*" matches GIT_DIR, etc.)
env_allowlist = [
    # API keys needed by mivia itself
    "MIVIA_REDACT_TOOL_ARGS",
    "TAVILY_API_KEY",
    "DEEPSEEK_API_KEY",
    "OPENROUTER_API_KEY",

    # POSIX / shell essentials
    "PATH", "HOME", "USER", "USERNAME", "LOGNAME",
    "SHELL", "TERM",
    "PWD", "OLDPWD",
    "TMPDIR", "TMP", "TEMP",

    # Locale / UI
    "LANG", "LANGUAGE",
    "EDITOR", "VISUAL",
    "DISPLAY", "WAYLAND_DISPLAY",

    # Standard prefix-based allowlists (wildcard = whole prefix namespace)
    "LC_*",
    "XDG_*",
    "GIT_*",           # GIT_DIR, GIT_WORK_TREE, GIT_SSH_COMMAND, GIT_TRACE, etc.
    "NODE_*",          # NODE_ENV, NODE_DEBUG, NODE_TLS_REJECT_UNAUTHORIZED, etc.

    # SSH
    "SSH_AUTH_SOCK", "SSH_AGENT_PID",

    # Go toolchain
    "GOPATH", "GOROOT", "GOPRIVATE", "GONOSUMCHECK", "GOSUMDB",
    "GOEXPERIMENT", "GOFLAGS",
    "GO*",             # GOOS, GOARCH, GOCACHE, GOMODCACHE, etc.

    # Rust toolchain
    "CARGO_HOME", "RUSTUP_HOME",
    "RUST_BACKTRACE", "RUST_LOG",

    # JavaScript / Node
    "NPM_CONFIG_USERCONFIG", "NODE_PATH",

    # C/C++ toolchain
    "CC", "CXX",
    "CGO_ENABLED", "CGO_CFLAGS", "CGO_LDFLAGS",

    # Python
    "PIP_INDEX_URL", "PIP_EXTRA_INDEX_URL",

    # Kubernetes
    "KUBECONFIG",

    # Build systems
    "CMAKE_GENERATOR", "MAKEOBJDIRPREFIX",
    "MAKE", "MAKEFLAGS", "MAKELEVEL", "MFLAGS",
]

# Subtractive filter for prefix matches: a variable admitted by a "*" rule is
# dropped if its name contains any of these. Exact entries above are never
# dropped, so a build that genuinely needs FOO_TOKEN names it outright.
# Nothing is compiled in - unset means prefix rules admit everything they match.
env_allow_keyword_blocklist = ["SECRET", "TOKEN", "PASSWORD", "API_KEY"]

# Security: env_blocklist removes vars from the resolved allowlist.
# GIT_DIR and GIT_WORK_TREE are blocked to prevent worktree isolation bypass:
# an agent with run_command could redirect git operations to the main repo's
# .git/ directory, breaking branch isolation in worktrees. Mivia's own
# internal git commands (internal/vcs/) use exec.Command with explicit cmd.Dir
# and never set these variables, so blocking them from agent tool env has no
# side effects on mivia itself.
env_blocklist = ["GIT_DIR", "GIT_WORK_TREE"]

# Replace the default env var allowlist entirely
# env_allowlist_only = ["PATH", "HOME", "USER", "PWD"]

# ---- Size limits ----
# All size/count limits are UNCAPPED by default. Uncomment to set a limit.
# max_read_bytes = 131072         # 128 KiB - read_file result cap
# max_write_kb = 1000             # 1 MiB - write_file content cap
# max_output_bytes = 2000000      # 2 MiB - run_command output cap (~1/3 head+2/3 tail)
# max_list_dir_entries = 2000     # list_dir max entries
# max_grep_matches = 50           # grep max matches
# max_glob_matches = 200          # glob max matches
# memory_backstop_mb = 256        # OOM guard (MiB); default 256; 0 → 256
# max_tool_result_bytes = 0       # history result cap; 0=uncapped; huge values warn once

# ---- Deferred tool loading (plan tools/05) ----
# Tools named here are always advertised. Authorized tools NOT named here are
# DEFERRED: their JSON schemas stop shipping on every request, replaced by a
# one-line index plus a `load_tools` tool the model calls to pull what it needs.
# A loaded tool becomes callable on the model's NEXT turn and stays loaded for
# the rest of the agent binding. Naming a tool here never grants authority - the
# list is intersected with the selected agent's effective tools.
#
# This list is exactly the workspace tools our prompts name as required process.
# That is the selection rule, not a preference: deferring a tool a prompt orders
# the model to use costs a wasted turn every session, which is the failure that
# got plan tools/07 rejected.
#
# Two prompt sources matter, not one - a workspace agent's own system_prompt
# supersedes the compiled default for the session it binds: the raw strings in
# internal/cli/prompt.go, and system_prompt in .mivia/agents/*.toml.
# You do not have to remember this: check_core_tier_covers_prompted_tools in
# scripts/verify_agent_config.py enforces it in `make verify`, and also rejects a
# typo'd core name (which would silently defer the tool it meant to keep).
# Declaring a deferred tool in an agent's tools = [...] is fine and stays fine -
# only prose instructions are the defect.
#
# Measured against this repo's registry with provider.EstimateToolSchemaCost
# (before the web tools moved to core):
#   core kept   1737 tok (8 tools)
#   deferred    1263 tok (5 tools: search, fetch_url, find_references,
#                         list_symbols, go_to_definition)
#   index        125 tok   load_tools 208 tok
#   NET SAVING   930 tok/request while none of the five are loaded
#
# search, fetch_url, and extract are CORE now: web research is a first-class
# root/research capability, not something to discover and load. Re-measure if
# you want current numbers; the remaining deferred set is find_references,
# list_symbols, and go_to_definition.
core = [
    "read_file",
    "list_dir",
    "grep",
    "glob",
    "write_file",
    "search_replace",
    "multi_edit",
    "run_command",
    "search",
    "fetch_url",
    "extract",
    # Phase 7 workflow tools are default for the root session: the root
    # prompt names them as required process, so their schemas must ship
    # always, never deferred (check_core_tier_covers_prompted_tools).
    "workflow_run",
    "workflow_status",
    "workflow_events",
    "workflow_inspect",
    "workflow_list_runs",
    "workflow_deliver",
    "workflow_cancel",
]


# ---------------------------------------------------------------------------
# WEB SEARCH (via Tavily)
# ---------------------------------------------------------------------------
[integrations.tavily]
# Primary web search engine for scope=web and scope=extract.
# Set TAVILY_API_KEY env var to enable (free: 1,000 searches/month).
# Falls back to free engines (DuckDuckGo, Bing) when key is unset.
api_key_env = "TAVILY_API_KEY"
# disable = false

# ---------------------------------------------------------------------------
# SUBAGENTS - parallel orchestration workers
# ---------------------------------------------------------------------------
[subagents]
max_workers = 0                    # 0 = unlimited (one goroutine per task)
max_depth = 0                      # 0 = unlimited nesting depth
max_fanout = 0                     # 0 = unlimited parallel sub-tasks per level
nested_steps = 0                   # 0 = unlimited sub-agent loop steps
# default_timeout_seconds = 0      # per-agent timeout (0 = use safety bound: 12 hours)
# default_budget = 0               # cost budget per sub-agent run (0 = unlimited)
max_audit_rounds = 0               # ADLC audit loop cap; 0 = unlimited

# Non-chat orchestration storage: memory (ephemeral) or sqlite (durable).
# Chat always uses one SQLite file for sessions, context, routes, and runs.
store_backend = "sqlite"
# This repository uses one catalog outside every worktree.
store_path = "~/.mivia/mivia-agent/context.db"

# ---------------------------------------------------------------------------
# CONTEXT - durable conversation storage ceilings
# ---------------------------------------------------------------------------
# Every value below is 0 = UNCAPPED, which is the shipped default, and these
# are the ONLY size bounds the durable context layer applies.
#
# They exist because publication is one transaction: exceeding any of them
# refuses the WHOLE turn - no source events, no checkpoint, no operation row -
# and since an active context only grows, one refusal wedges the session and
# history stops persisting for good. They were previously compiled-in constants
# (32 KiB of active context, 64 KiB per message) sized far below the 200k-1M
# token windows configured above, so the first turn in which the agent read a
# file destroyed the conversation.
#
# Set one only if you have a storage reason to, knowing the cost of a refusal.
# max_source_event_bytes is CHUNK SIZE for large source payloads (not a
# whole-payload reject). 0 = built-in default chunk size (64 KiB). Multi-chunk
# payloads reassemble under one content ref (full-payload SHA-256).
# [context]
# max_source_event_bytes  = 0   # payload chunk size (0 → default 64 KiB)
# max_checkpoint_bytes    = 0   # a checkpoint's serialized active context
# max_commit_events       = 0   # messages published by one turn
# max_commit_event_bytes  = 0   # one turn's aggregate payload bytes
# max_session_state_bytes = 0   # a stored session's serialized messages
# max_export_bytes        = 0   # a context export

# ---------------------------------------------------------------------------
# Privacy
# ---------------------------------------------------------------------------
[privacy]
# redact_tool_args hides run_command argv wholesale. Separate from the
# patterns below, which redact by content wherever it appears.
redact_tool_args = false

# Redaction is configuration-only: nothing is compiled into the binary, so
# WITH THESE UNSET NOTHING IS REDACTED ANYWHERE -- tool previews, run_command
# output (which the model reads), event bodies and audit metadata all pass
# through intact, including into the session transcript on disk.
#
# Each match is replaced by redaction_placeholder. An invalid pattern is a
# startup error, never a silently dropped rule.
redaction_patterns = [
  # Quotes are optional around key and value so this also matches JSON tool
  # argv ("token":"…"), which reaches the default preview as raw text.
  # The (?:bearer\s+)? is load-bearing: without it this pattern consumes
  # "Authorization: Bearer" and stops, leaving the credential for a later
  # pattern that no longer matches. With it, order does not matter.
  '(?i)"?(?:password|passwd|token|secret|api[_-]?key|authorization)"?\s*[:=]\s*"?(?:bearer\s+)?[^"\s,;}]+',
  '(?i)bearer\s+[A-Za-z0-9._~+/=-]+',
  '(?:sk-ant-|sk-|ghp_|github_pat_|xox[baprs]-)[A-Za-z0-9._~-]+',
  '(?is)-----BEGIN [A-Z0-9 ]+PRIVATE KEY-----.*?(?:-----END [A-Z0-9 ]+PRIVATE KEY-----|$)',
]

# JSON object keys whose values are elided wholesale (case-insensitive
# substring). Deliberately absent: "prompt" and "reasoning" -- they are the
# agent's own instructions and deliberation, not your secrets, and eliding
# them makes audit metadata useless while protecting nothing.
redaction_key_names = ["password", "token", "secret", "api_key", "authorization"]

redaction_placeholder = "[redacted]"

# --------------------------------------------------------------------------
# Lifecycle hooks (mivia's own layer - NOT the Git hooks under .githooks/)
#
# These are PROJECT hooks: they live in the repository, so they run for anyone
# who clones it and starts mivia here, with no confirmation step. That is the
# deliberate design - see docs/development/lifecycle-hooks.md, "Project hooks
# come from the repository". Both scripts are in .mivia/hooks/ and are meant to
# be read before they are trusted.
#
# argv[0] resolves against THIS file's directory, so "./hooks/x" is
# .mivia/hooks/x - never a program of the same name on PATH.
# --------------------------------------------------------------------------

[[hooks]]
event   = "PreToolUse"
matcher = "^run_command$"

  [[hooks.handlers]]
  # Refuses an argv that skips verification (.mivia/policy/agent-hook-bypass.json)
  # or destroys uncommitted work (.mivia/policy/destructive-commands.json). The
  # gate holds no patterns of its own - edit the JSON, never a copy of it.
  type       = "command"
  argv       = ["./hooks/run-command-guard.py"]
  timeout    = 10
  # A gate that cannot answer must not become a gate that is off. This is the
  # default for PreToolUse; it is written out because it is the whole point of
  # this hook.
  on_timeout = "block"

[[hooks]]
event   = "PostToolUse"
matcher = "^(write_file|search_replace|multi_edit)$"

  [[hooks.handlers]]
  type    = "command"
  argv    = ["./hooks/gofmt-changed.sh"]
  timeout = 15
