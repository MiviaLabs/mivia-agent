rules:
  # --- Agent config: Bash allowlists ---
  - id: mivia.generic.no-wildcard-bash-allow
    languages:
      - generic
    severity: ERROR
    message: Do not grant wildcard Bash(...) permissions; allow exact commands only.
    paths:
      include:
        - /AGENTS.md
        - /CLAUDE.md
        - /.claude/**
        - /.codex/**
        - /.agents/**
        - /.github/**
    patterns:
      - pattern-inside: |
          "allow": [
            ...
          ]
      - pattern-regex: 'Bash\([^)\n]*\*[^)\n]*\)'

  - id: mivia.generic.no-shell-metachar-bash-allow
    languages:
      - generic
    severity: ERROR
    message: Do not grant Bash(...) permissions containing shell metacharacters.
    paths:
      include:
        - /AGENTS.md
        - /CLAUDE.md
        - /.claude/**
        - /.codex/**
        - /.agents/**
        - /.github/**
    patterns:
      - pattern-inside: |
          "allow": [
            ...
          ]
      - pattern-regex: 'Bash\([^)\n]*[;&|`$<>][^)\n]*\)'

  # --- Policy suppressions and debt markers ---
  - id: mivia.generic.no-semgrep-suppression
    languages:
      - generic
    severity: ERROR
    message: Do not suppress Semgrep findings; fix the rule or document an explicit policy exception.
    paths:
      include:
        - /cmd/**
        - /internal/**
        - /pkg/**
        - /AGENTS.md
        - /CLAUDE.md
        - /.mivia/**
        - /.claude/**
        - /.codex/**
        - /.agents/**
        - /.github/**
      exclude:
        - /.agents/quality/**
        - /.agents/templates/**
    pattern-regex: '(?i)\bnosemgrep\b'

  - id: mivia.generic.no-unresolved-drift-markers
    languages:
      - generic
    severity: ERROR
    message: Do not commit unresolved TODO/FIXME/HACK/XXX markers; finish the work or track it in a task file.
    paths:
      include:
        - /cmd/**
        - /internal/**
        - /pkg/**
        - /.claude/**
        - /.codex/**
        - /.agents/**
        - /.github/**
      exclude:
        - /.mivia/policy/**
        - /semgrep/**
        - /scripts/**
        # SKILL.md files describe the rule itself (the marker tokens are the
        # banned tokens); excluding them prevents self-hits on the rule's own
        # description text. The metadata frontmatter is also where legitimate
        # TODO/FIXME cross-references live, and SKILL.md is prose, not code.
        - "**/SKILL.md"
    # Product + tool adapters. Policy markdown that lists the ban tokens is excluded to avoid self-hits.
    pattern-regex: '(?i)\b(TODO|FIXME|HACK|XXX)\b'

  # --- Branding and product naming ---
  - id: mivia.generic.brand-mivialabs
    languages:
      - generic
    severity: ERROR
    message: Use MiviaLabs as the brand spelling, not the two-word spaced form.
    paths:
      include:
        - /AGENTS.md
        - /CLAUDE.md
        - /README.md
        - /docs/**
        - /.mivia/**
        - /.claude/**
        - /.codex/**
        - /.agents/**
        - /.github/**
      exclude:
        - /.agents/quality/**
    pattern-regex: '\bMivia Labs\b'

  - id: mivia.generic.product-binary-is-mivia
    languages:
      - generic
    severity: ERROR
    message: Product CLI binary is mivia, not mivia-agent. Use mivia for invocations; mivia-agentkit and repo path github.com/MiviaLabs/mivia-agent remain allowed.
    paths:
      include:
        - /AGENTS.md
        - /CLAUDE.md
        - /README.md
        - /docs/**
        - /.mivia/**
        - /.claude/**
        - /.codex/**
        - /.agents/**
        - /.github/**
      exclude:
        - /.agents/quality/**
    # Affirmative binary/CLI usage only (not historical rename notes or ban prose).
    # Allowed: mivia-agentkit, github.com/MiviaLabs/mivia-agent, path .../mivia-agent
    pattern-regex: '(?i)(\./mivia-agent\b|\bmivia-agent\s+(doctor|run|audit|adapters|hook|campaign|init|update|version|help|config)\b|\b(install|ship|release)\s+mivia-agent\b|\bbinary\s+(named\s+|is\s+|name[:\s]+)mivia-agent\b)'

  # --- Git hook integrity ---
  - id: mivia.generic.no-git-hook-bypass-in-agent-config
    languages:
      - generic
    severity: ERROR
    message: Do not instruct agents to bypass Git hooks; fix validation failures or report blockers.
    paths:
      include:
        - /AGENTS.md
        - /CLAUDE.md
        - /.mivia/**
        - /.agents/**
        - /.claude/**
        - /.codex/**
        - /.github/**
      exclude:
        - /.agents/quality/**
        - /.mivia/policy/**
    # Affirmative bypass instructions only; ban lists may name the flags.
    pattern-regex: '(?i)(\b(use|using|pass|passing|add|adding|run|running|enable|enabling|commit|push)\b[^\n]{0,60}(--no-verify|\bHUSKY\s*=\s*0\b|\bHUSKY_SKIP_HOOKS\b|\bSKIP_GIT_HOOKS\b|\bLEFTHOOK\s*=\s*0\b)|(--no-verify|\bHUSKY\s*=\s*0\b|\bHUSKY_SKIP_HOOKS\b)[^\n]{0,40}\b(to skip|to bypass|skips?\s+hooks?)\b)'

  # --- Skill report contract ---
  - id: mivia.generic.no-skill-freeform-output-heading
    languages:
      - generic
    severity: ERROR
    message: Skills must use mivia-report/v1 from .agents/templates/agent-report-v1.md instead of free-form Output sections.
    paths:
      include:
        - /.agents/skills/**/SKILL.md
        - /.mivia/skills/**/SKILL.md
        - /.claude/skills/**/SKILL.md
    pattern-regex: '^## Output\s*$'

  - id: mivia.generic.skills-require-mivia-report-v1
    languages:
      - generic
    severity: ERROR
    message: Skill reports must name ReportFormat mivia-report/v1 (not free-form or legacy report ids).
    paths:
      include:
        - /.agents/skills/**/SKILL.md
        - /.mivia/skills/**/SKILL.md
        - /.claude/skills/**/SKILL.md
    pattern-regex: '(?i)ReportFormat:\s*(?!mivia-report/v1\b)\S+'

  - id: mivia.generic.architecture-review-must-stay-portable
    languages:
      - generic
    severity: ERROR
    message: The architecture-review skills must stay project- and language-agnostic; discover workspace-native instructions, evidence, and checks.
    paths:
      include:
        - /.agents/skills/architecture-review/**
        - /.agents/skills/panel-architecture-review/**
        - /.mivia/skills/architecture-review/**
        - /.mivia/skills/panel-architecture-review/**
    pattern-regex: '(?im)(\bmivia\b|mivia-report/v1|\.mivia/|AGENTS\.md|\bADLC\b|\bStep\s+0\b|\bchallenge\s+panel\b|\b(bug-audit|secure-change|verify-change)\b|engineering:architecture|docs/OWNERS\.yaml|docs/architecture/|\breviewing\s+(?-i:HEAD)\b|\b(at|against)\s+(?-i:HEAD)\b|(?-i:\bGo\b)\s+rejects?\s+cycles?\b|\bgo[- ]idiomatic\b|context\.Context|cmd/mivia|\bmake\s+(verify|invariants)\b|INV-(AG|SEC|TUI)-|scripts/check_go_structure\.py|\binternal/|^(?![^\n]*\b(if|when)\b[^\n]*\bdocs/[^\n]*\bexists?\b)[^\n]*\bdocs/|^(?![^\n]*\b(if|when)\b[^\n]*(\.github/|\.gitlab/|\.circleci/)[^\n]*\bexists?\b)[^\n]*(\.github/|\.gitlab/|\.circleci/)|^(?![^\n]*\b(if|when)\b[^\n]*(workspace|project)[^\n]*(uses?|declares?|discovers?|supplies?)[^\n]*\bGit\b)[^\n]*\bgit\s+(head|diff|show|log|status|grep|rev-parse|merge-base|ls-files)\b|^[^\n]*\b(use|prefer)\s+(the\s+)?(Golang|Python|TypeScript|JavaScript|Rust|Java|Kotlin|Swift|Ruby|PHP)\b[^\n]*\b(use|prefer)\s+(the\s+)?(Golang|Python|TypeScript|JavaScript|Rust|Java|Kotlin|Swift|Ruby|PHP)\b|^(?=[^\n]*\b(use|prefer)\s+(the\s+)?(?P<portable_lang>Golang|Python|TypeScript|JavaScript|Rust|Java|Kotlin|Swift|Ruby|PHP)\b)(?![^\n]*\b(if|when)\b[^\n]*(workspace|project)[^\n]*(uses?|declares?|discovers?|supplies?)[^\n]*\b(?P=portable_lang)\b)(?![^\n]*\b(?P=portable_lang)\b[^\n]*\b(if|when)\b[^\n]*(discover(ed|y|s|ing)?|supplied)\b)(?![^\n]*\b(?P=portable_lang)\b[^\n]*\b(if|when)\b[^\n]*(workspace|project)[^\n]*(uses?|declares?|discovers?|supplies?)[^\n]*\b(?P=portable_lang)\b)[^\n]*\b(use|prefer)\s+(the\s+)?(?P=portable_lang)\b|^(?![^\n]*\b(if|when)\b[^\n]*go\.mod[^\n]*\bexists?\b)[^\n]*\bgo\s+(build|test|list|vet)\b|^(?![^\n]*\b(if|when)\b[^\n]*Cargo\.toml[^\n]*\bexists?\b)[^\n]*\b(run|execute)\s+cargo\s+test\b|^(?![^\n]*\b(if|when)\b[^\n]*(package\.json|npm)[^\n]*\b(exists?|supplied|declared|available)\b)[^\n]*\b(run|execute)\s+npm\s+test\b|^(?![^\n]*\b(if|when)\b[^\n]*(pytest|pyproject)[^\n]*\b(exists?|supplied|declared|available)\b)[^\n]*\b(run|execute)\s+pytest\b)'

  # --- Architecture guidance (docs / rules) ---
  - id: mivia.generic.no-process-per-subagent-default
    languages:
      - generic
    severity: ERROR
    message: Do not recommend process-per-subagent as the default architecture; prefer in-process concurrency with reviewed shared adapters for external processes.
    paths:
      include:
        - /docs/**
        - /.agents/rules/**
        - /.agents/skills/**/SKILL.md
        - /.mivia/skills/**/SKILL.md
        - /AGENTS.md
        - /CLAUDE.md
        - /README.md
      exclude:
        - /.agents/quality/**
    # Affirmative recommendation only (not forbid/reject tables).
    pattern-regex: '(?i)\b(use|using|prefer|preferred|defaults?\s+to|recommend(?:ed|s)?|spawn|spawning)\b(?![^\n]{0,80}\b(reject|forbid|forbidden|not|never|avoid)\b)[^\n]{0,80}\b(one\s+process\s+per\s+(sub-?)?agent|process-per-(sub-?)?agent|os/exec\s+per\s+(sub-?)?agent)\b'

  - id: mivia.rules.no-os-exec-per-agent-default
    languages:
      - generic
    severity: ERROR
    message: .agents/rules must not recommend os/exec-per-agent as the default concurrency architecture.
    paths:
      include:
        - /.agents/rules/**
    pattern-regex: '(?i)\b(use|using|prefer|preferred|defaults?\s+to|recommend(?:ed|s)?)\b[^\n]{0,80}\b(os/exec|exec\.Command)\b[^\n]{0,40}\b(per|for\s+each)\s+(agent|subagent)\b'

  # --- Go product code ---
  - id: mivia.go.no-hardcoded-secrets
    languages:
      - go
    severity: ERROR
    message: Do not hardcode secrets, API keys, tokens, or private keys in product code.
    paths:
      include:
        - /cmd/**/*.go
        - /internal/**/*.go
        - /pkg/**/*.go
      exclude:
        - /**/*_test.go
    pattern-either:
      - pattern-regex: '(?i)\b(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key|password|passwd|client[_-]?secret)\s*[:=]\s*"[^"$\n]{8,}"'
      - pattern-regex: '(?i)\b(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token|private[_-]?key|password|passwd|client[_-]?secret)\s*[:=]\s*''[^''$\n]{8,}'''
      - pattern-regex: '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
      - pattern-regex: '(?i)\bAKIA[0-9A-Z]{16}\b'
      - pattern-regex: '(?i)\bgh[pousr]_[A-Za-z0-9_]{20,}\b'
      - pattern-regex: '(?i)\bxox[baprs]-[A-Za-z0-9-]{10,}\b'

  - id: mivia.go.no-panic-in-internal
    languages:
      - go
    severity: ERROR
    message: Return errors from internal packages instead of panicking.
    paths:
      include:
        - /internal/**/*.go
      exclude:
        - /**/*_test.go
    pattern: panic(...)

  - id: mivia.go.no-fatal-exit-in-internal
    languages:
      - go
    severity: ERROR
    message: Internal packages must return errors instead of terminating the process.
    paths:
      include:
        - /internal/**/*.go
      exclude:
        - /**/*_test.go
    pattern-either:
      - pattern: log.Fatal(...)
      - pattern: log.Fatalf(...)
      - pattern: os.Exit(...)

  - id: mivia.go.no-value-builder-field-in-ui
    languages:
      - go
    severity: ERROR
    message: >-
      Do not hold a strings.Builder by value in a UI model struct. These
      models are copied on every Update and HandleEvent, and a non-zero
      Builder panics when it is written after a copy (its own copyCheck).
      Use a plain string field, or a *strings.Builder.
    paths:
      include:
        - /internal/ui/**/*.go
        - /internal/uikit/**/*.go
      exclude:
        - /**/*_test.go
    pattern: |
      type $T struct {
        ...
        $F strings.Builder
        ...
      }

  - id: mivia.go.no-shell-exec
    languages:
      - go
    severity: ERROR
    message: Do not run shell interpreters from Go; use parameterized exec with allowlisted commands or Go APIs.
    paths:
      include:
        - /cmd/**/*.go
        - /internal/**/*.go
        - /pkg/**/*.go
      exclude:
        - /**/*_test.go
    pattern-either:
      - pattern: exec.Command("sh", "-c", ...)
      - pattern: exec.Command("bash", "-c", ...)
      - pattern: exec.Command("/bin/sh", "-c", ...)
      - pattern: exec.Command("/bin/bash", "-c", ...)
      - pattern: exec.CommandContext($CTX, "sh", "-c", ...)
      - pattern: exec.CommandContext($CTX, "bash", "-c", ...)
      - pattern: exec.CommandContext($CTX, "/bin/sh", "-c", ...)
      - pattern: exec.CommandContext($CTX, "/bin/bash", "-c", ...)

  - id: mivia.go.no-world-writable-mode
    languages:
      - go
    severity: ERROR
    message: Do not create world-writable files or directories.
    paths:
      include:
        - /cmd/**/*.go
        - /internal/**/*.go
        - /pkg/**/*.go
    pattern-either:
      - pattern: os.WriteFile(..., 0777)
      - pattern: os.WriteFile(..., 0666)
      - pattern: os.Mkdir(..., 0777)
      - pattern: os.MkdirAll(..., 0777)
      - pattern: os.Chmod(..., 0777)
      - pattern: os.Chmod(..., 0666)

  - id: mivia.go.tests-use-t-tempdir
    languages:
      - go
    severity: ERROR
    message: Tests must use t.TempDir() for temporary filesystem state.
    paths:
      include:
        - /cmd/**/*_test.go
        - /internal/**/*_test.go
        - /pkg/**/*_test.go
    pattern-either:
      - pattern: os.MkdirTemp("", ...)
      - pattern: os.CreateTemp("", ...)
      - pattern: ioutil.TempDir("", ...)
      - pattern: ioutil.TempFile("", ...)

  - id: mivia.go.tests-no-time-sleep
    languages:
      - go
    severity: ERROR
    message: Tests should use deterministic synchronization or fakes instead of time.Sleep.
    paths:
      include:
        - /cmd/**/*_test.go
        - /internal/**/*_test.go
        - /pkg/**/*_test.go
    pattern: time.Sleep(...)

  - id: mivia.go.no-direct-tool-execution-outside-dispatcher
    languages:
      - go
    severity: ERROR
    message: Route tool execution through internal/runtime.Dispatcher; do not call Registry.Execute from agent orchestration.
    paths:
      include:
        - /internal/agent/**/*.go
      exclude:
        - /**/*_test.go
    pattern: $REG.Execute(...)

  # --- New terminal UI: internal/uikit and internal/ui boundary rules ---
  # docs/design/wireframes-panes.md and the mivia-ui build spec require
  # these mechanically, not just by convention.

  - id: mivia.go.uikit-no-bubbletea-lipgloss
    languages:
      - go
    severity: ERROR
    message: internal/uikit/** is UI-agnostic and must not import bubbletea or lipgloss.
    paths:
      include:
        - /internal/uikit/**/*.go
    pattern-regex: '"(charm\.land/(bubbletea|lipgloss)(/v2)?|github\.com/charmbracelet/(bubbletea|lipgloss)(/v2)?)"'

  - id: mivia.go.ui-no-harness-imports
    languages:
      - go
    severity: ERROR
    message: UI packages are self-contained and must not import the CLI or the real harness. See docs/design/ui-isolation.md.
    paths:
      include:
        - /internal/ui/**/*.go
        - /internal/uikit/**/*.go
    pattern-regex: '"github\.com/MiviaLabs/mivia-agent/internal/(cli.*|chat|agent|coordinator|hub)"'

  - id: mivia.go.ui-no-raw-print
    languages:
      - go
    severity: ERROR
    message: internal/ui/** must not call fmt.Print*; one stray print corrupts the frame. Write to the given io.Writer, or log to a file.
    paths:
      include:
        - /internal/ui/**/*.go
      exclude:
        - /**/*_test.go
    pattern-either:
      - pattern: fmt.Print(...)
      - pattern: fmt.Println(...)
      - pattern: fmt.Printf(...)

  - id: mivia.go.uikit-ui-no-init
    languages:
      - go
    severity: ERROR
    message: internal/uikit/**, internal/ui/**, and internal/newtui/** must not use init(); wire dependencies explicitly.
    paths:
      include:
        - /internal/uikit/**/*.go
        - /internal/ui/**/*.go
        - /internal/newtui/**/*.go
      exclude:
        - /**/*_test.go
    pattern: func init() { ... }

  - id: mivia.go.uikit-ui-no-package-level-sync-state
    languages:
      - go
    severity: ERROR
    message: >-
      internal/uikit/**, internal/ui/**, and internal/newtui/** must not hold
      package-level mutable singleton state (sync.Mutex/RWMutex/Map, atomic.*).
      This is the exact god-object pattern (subagent_progress.go's globalBusState,
      orchestration_state.go's coordinators sync.Map) the new UI tree exists to
      avoid; immutable lookup tables built once at package init (const-like
      var maps/slices, go:embed FS vars) are not the target and are not
      flagged by this rule.
    paths:
      include:
        - /internal/uikit/**/*.go
        - /internal/ui/**/*.go
        - /internal/newtui/**/*.go
      exclude:
        - /**/*_test.go
    pattern-either:
      - pattern: var $X sync.Mutex
      - pattern: var $X sync.RWMutex
      - pattern: var $X sync.Map
      - pattern: var $X sync.WaitGroup
      - pattern: var $X atomic.$T

  # --- Workspace skills live under .agents/skills, never .mivia/skills ---
  #
  # Project-level skill paths must go through workspace.SkillsDir(root) so
  # the canonical home stays in one place. User-level skills legitimately
  # live under ~/.mivia/skills (resolved via workspace.UserSkillsDir), so
  # constructions of the form `filepath.Join(home, ".mivia", "skills")`
  # or `t.TempDir() + HOME` are allowlisted below. Any OTHER hardcoded
  # `.mivia`, `skills` tuple in production or test code is a path-discipline
  # defect: a new contributor copying the old shape will load skills from
  # a tree the binary no longer reads.
  - id: mivia.go.no-hardcoded-mivia-skills-path
    languages:
      - generic
    severity: ERROR
    message: |
      Hardcoded `.mivia` + `skills` path in code outside the HOME anchor
      (workspace.UserSkillsDir). Project-level skills live under
      .agents/skills (workspace.SkillsDir); the loader does not read
      .mivia/skills. Use workspace.SkillsDir(root) for project skills
      and workspace.UserSkillsDir() for user skills.
    paths:
      include:
        - /internal/**/*.go
        - /cmd/**/*.go
    patterns:
      - pattern-regex: '"\.mivia"\s*,\s*"skills"|\.mivia/\s*skills'
      - pattern-not-inside: |
          $HOME = ...
          ...
      - pattern-not-inside: |
          t.Setenv("HOME", ...)
          ...
      - pattern-not-inside: |
          UserSkillsDir(...)
          ...
      - pattern-not-inside: |
          filepath.Join(home, ".mivia", "skills")
          ...

  # --- Test quality & fake-test prevention ---
  - id: mivia.go.no-empty-test
    languages:
      - go
    severity: ERROR
    message: Test functions and subtests must not have an empty body.
    paths:
      include:
        - /cmd/**/*_test.go
        - /internal/**/*_test.go
        - /pkg/**/*_test.go
    pattern-either:
      - pattern: func $FN(t *$T) {}
      - pattern: func $FN(t testing.TB) {}
      - pattern: t.Run($NAME, func(t *$T) {})


  - id: mivia.go.no-tautological-test-assertion
    languages:
      - go
    severity: ERROR
    message: Do not use tautological test assertions that always pass unconditionally.
    paths:
      include:
        - /cmd/**/*_test.go
        - /internal/**/*_test.go
        - /pkg/**/*_test.go
    pattern-either:
      - pattern: assert.True($T, true)
      - pattern: assert.False($T, false)
      - pattern: assert.Nil($T, nil)
      - pattern: require.True($T, true)
      - pattern: require.False($T, false)
      - pattern: require.Nil($T, nil)

  - id: mivia.go.provider-body-read-needs-watchdog
    languages:
      - go
    severity: ERROR
    message: >-
      Read a provider response body through wrapBodyWithIdleWatchdog (or the
      client's wrapWithIdleWatchdog). A raw read of resp.Body has no bound of
      its own, so a peer that answers and then goes silent holds the call to
      the transport's absolute wall - and nested subagent turns do not stream,
      so no human sees the stall.
    paths:
      include:
        - /internal/provider/**/*.go
      exclude:
        - /**/*_test.go
    pattern-either:
      - pattern: io.ReadAll($RESP.Body)
      - pattern: io.ReadAll(io.LimitReader($RESP.Body, ...))
      - pattern: io.Copy($DST, $RESP.Body)
      - pattern: io.CopyN($DST, $RESP.Body, ...)
      - pattern: bufio.NewScanner($RESP.Body)
      - pattern: bufio.NewReader($RESP.Body)
      - pattern: json.NewDecoder($RESP.Body)

  - id: mivia.go.hub-wire-no-raw-error-text
    languages:
      - go
    severity: ERROR
    message: >-
      Classify error text with chat.TurnErrorMessage before putting it on the
      hub wire. Provider and tool error text can quote the request that
      produced it (DC-14), and this socket reaches ANOTHER process - the local
      NDJSON surface already emits a classified string, so a raw err.Error()
      here leaves the remote process better informed than the local one, in
      the direction that leaks.
    paths:
      include:
        - /internal/hub/**/*.go
      exclude:
        - /**/*_test.go
    pattern-either:
      # Any .Error() call at all. The narrow $EV.Err.Error() form was trivially
      # bypassed - a local variable, a differently-named field, a helper taking
      # a bare error, errors.Join/Unwrap, or fmt.Errorf(...).Error() all
      # defeated it, seven shapes proven by review. This package legitimately
      # renders no error text: toWire classifies through chat.TurnErrorMessage
      # and nothing else here formats an error, so a blanket ban has no honest
      # false positive to make.
      - pattern: $X.Error()
      - pattern: fmt.Sprint($E)
      - pattern: fmt.Sprintln($E)
      - pattern: fmt.Sprintf("...", ..., $EV.Err, ...)

  - id: mivia.go.no-truncation-call-inside-envelope-literal
    languages:
      - go
    severity: ERROR
    message: >-
      applyTruncation MUTATES the Envelope it is passed, and Envelope is
      embedded BY VALUE in every wire payload. A composite literal that both
      copies `Envelope: env` and calls `applyTruncation(&env, ...)` reads an
      unsequenced operand: the Go spec does not order a non-call operand
      against a function call in the same literal, so the copy may be taken
      before the mutation. When it is, `trunc` is nil and an amputated field
      renders as COMPLETE - the event contract says `trunc` absent means
      nothing was cut, with no third reading. Hoist the applyTruncation call
      into a statement BEFORE the literal.
    paths:
      include:
        - /internal/chatsync/**/*.go
    patterns:
      - pattern: |
          $T{..., Envelope: $E, ...}
      - pattern: |
          $T{..., $F: applyTruncation(&$ENV, ...), ...}

  - id: mivia.go.no-chat-principal-as-sync-handle
    languages:
      - go
    severity: ERROR
    message: >-
      chat.Session.SessionID is an unguessable principal - the authorization
      subject for contextstate - and chatsync.LocalHandle is a LOCAL-only
      value that names an outbox directory and a persisted identity record.
      Converting the principal into the handle writes a live capability into
      durable local state and, historically, into a request URL. Resolve the
      handle from the persisted identity instead
      (chatsync.LoadOrCreateIdentity keyed by chatsync.IdentityKey). The
      runtime proof that the value did not travel is
      TestChatPrincipalNeverReachesTheWireOrDisk; this rule only makes the
      wrong line hard to write.
    paths:
      include:
        - /internal/**/*.go
    pattern-either:
      - pattern: chatsync.LocalHandle($X.SessionID)
      - pattern: LocalHandle($X.SessionID)
      - pattern: chatsync.LocalHandle($X.sessionID)
      - pattern: LocalHandle($X.sessionID)

  - id: mivia.go.no-validstring-rune-boundary-backoff
    languages:
      - go
    severity: ERROR
    message: >-
      A truncation that cuts to a byte budget and then backs off with
      utf8.ValidString in the LOOP CONDITION checks the ENTIRE prefix, not the
      cut boundary. One invalid byte anywhere earlier in the string drags the
      result all the way back to that byte, so a 16 KiB budget can keep 10
      bytes and still report an ordinary budget cut (DC-6, amputation
      disguised as truncation). It is also O(n^2) on a long string. Back off
      across the boundary rune only - utf8.DecodeLastRuneInString reports
      (RuneError, 1) for a byte that cannot start a rune or an incomplete
      trailing sequence, while a genuine U+FFFD decodes with size 3 and is
      kept. Reference implementation - internal/chatsync/truncate.go
      (truncateString).
    paths:
      include:
        - /**/*.go
    pattern-either:
      # Shape 1: the check IS the loop condition, on the `for` line itself.
      - pattern-regex: 'for[^\n{]*!\s*utf8\.ValidString\('
      # Shape 2: the check sits anywhere INSIDE the body of a loop that walks
      # an index downward. internal/hooks/protocol.go carried exactly this
      # before 04f36f5b (`for i := limit - 1; ...; i--` with
      # `utf8.ValidString(s[:i])` two lines below), and a rule keyed on the
      # `for` line alone could not see it. The mechanism is identical: a
      # shrinking cut re-validated over the whole prefix.
      - patterns:
          - pattern: utf8.ValidString(...)
          - pattern-either:
              - pattern-inside: |
                  for ...; ...; $I-- {
                    ...
                  }
              - pattern-inside: |
                  for ...; ...; $I -= $N {
                    ...
                  }
              - pattern-inside: |
                  for ...; ...; $I = $I - $N {
                    ...
                  }

  - id: mivia.go.no-locked-field-reread
    languages:
      - go
    severity: ERROR
    message: >-
      $VAR was captured from $RECV.$FIELD under $RECV.$MU.Lock() above,
      specifically so every later use of this value stays fenced against a
      concurrent writer. Reading $RECV.$FIELD again directly here throws that
      fence away: it is an unsynchronized read of a mutex-guarded field (data
      race under -race), and it can observe a DIFFERENT value than $VAR
      within the same logical operation if a writer runs in between - DC-29,
      exactly what broke internal/chatsync/poller.go's ConsumeInput call
      (fixed in a2e554d7): it re-read p.sessionID instead of reusing the
      already-locked sessID, so a concurrent SetSessionID could send the
      consume request against a different session than the one the input
      was actually fetched from. Reuse the captured local instead.
    paths:
      include:
        - /internal/**/*.go
      exclude:
        - /**/*_test.go
    patterns:
      - pattern-inside: |
          $RECV.$MU.Lock()
          $VAR := $RECV.$FIELD
          $RECV.$MU.Unlock()
          ...
      - pattern: $RECV.$FIELD
      - pattern-not-inside: $VAR := $RECV.$FIELD
